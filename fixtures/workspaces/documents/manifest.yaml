description: >-
  A task that produced a document, for the surfaces that render one: the file
  link in a message, the files grid, and the document viewer.

# Developer mode is what the drive handle and the debug routes are gated on, so
# a workspace meant to be driven has to have it. Nothing else is pinned: every
# other preference and every feature flag falls through to the app's defaults,
# which is what keeps this fixture from breaking each time one of them moves.
settings:
  preferences:
    developerMode: true

tasks:
  - key: generated-pdf
    name: Red and blue squares PDF
    agedMinutes: 12
    files:
      # Written by the run this transcript was recorded from, and committed
      # rather than regenerated: what the transcript says the agent produced
      # has to be the file the seeded task actually holds.
      - from: red-and-blue-squares.pdf
        to: output/red-and-blue-squares.pdf
