description: Prepares the repo for a typical CI job

inputs:
  token:
    description: GITHUB_TOKEN used for authenticated dependency downloads during install
    required: true

name: Prepare

runs:
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
    # pnpm-workspace.yaml included so allowBuilds/ignoredOptionalDependencies
    # changes bust the cache (setup-node only hashes pnpm-lock.yaml by default).
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          pnpm-workspace.yaml
        node-version: "24"
    - name: set-cache-dirs
      run: |
        mkdir -p "$HOME/.cache/dugite"
        echo "DUGITE_CACHE_DIR=$HOME/.cache/dugite" >> "$GITHUB_ENV"
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
        elif [ "$RUNNER_OS" = "macOS" ]; then
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
        fi
      shell: bash
    - env:
        GITHUB_TOKEN: ${{ inputs.token }}
      name: install-dependencies
      run: |
        for attempt in 1 2 3; do
          pnpm install --frozen-lockfile && break
          if [ $attempt -lt 3 ]; then
            echo "Install failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
          else
            exit 1
          fi
        done
      shell: bash
    - name: verify-electron-install
      run: pnpm --filter @instrument-org/studio exec install-electron
      shell: bash
    - uses: rharkor/caching-for-turbo@00a0515f175df9fd2e15c4560144ad5fdbebb0c7 # v2.3.13
  using: composite
