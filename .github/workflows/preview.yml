name: Preview Build
# The title a run has in the Actions list: what the build is for and which
# platforms, beside the run number that also ends its name.
run-name: ${{ inputs.name || github.ref_name }} (${{ inputs.os || 'mac' }})

# A build with an identity of its own (bundle id, product name, protocol,
# install folder, purple icon), so it runs beside Instrument and its first
# launch is a real first launch: no userData, no keychain item, no privacy
# grants. The identity ends in the run number, so a rebuild of the same branch
# is a first launch too, rather than opening where the last build left off.
# Each platform's artifact runs from where it lands or installs beside
# Instrument, and can be deleted after. Pick the branch in "Use workflow
# from"; the name says what the build is for and defaults to the branch. See
# APP_FLAVOR in packages/shared.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Preview name (letters, digits, dashes); defaults to the branch name
        required: false
        type: string
      os:
        description: Which platforms to build
        required: false
        type: choice
        default: mac
        options:
          - mac
          - windows
          - linux
          - all
      update_test_version:
        description: "Test only, macOS and Windows: also package this preview at this higher version, to test an update between the two"
        required: false
        type: string

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      slug: ${{ steps.plan.outputs.slug }}
    env:
      INSTRUMENT_PREVIEW_NAME: ${{ inputs.name || github.ref_name }}
      PREVIEW_OS: ${{ inputs.os || 'mac' }}
    steps:
      # The name the build is made under comes from the module that turns it
      # into the app's flavor, so the two cannot disagree; it imports nothing,
      # so it runs straight from a checkout of that one file.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: packages/shared/src/constants.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      # Fails early on a name that reduces to nothing. Linux builds both
      # architectures, since a Linux test machine is as likely to be an ARM
      # virtual machine as a PC.
      - name: Resolve name and platforms
        id: plan
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          slug=$(node --input-type=module -e '
            const { previewBuildNameOf } = await import("./packages/shared/src/constants.ts");
            console.log(previewBuildNameOf(process.env.INSTRUMENT_PREVIEW_NAME, Number(process.env.RUN_NUMBER)));
          ')
          if [ -z "$slug" ]; then
            echo "::error::The preview name has no letters or digits in it."
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          mac='{"os":"mac","arch":"arm64","runner":"macos-26"}'
          windows='{"os":"windows","arch":"x64","runner":"windows-latest"}'
          linux='{"os":"linux","arch":"x64","runner":"ubuntu-latest"},{"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm"}'
          case "$PREVIEW_OS" in
            mac) legs="$mac" ;;
            windows) legs="$windows" ;;
            linux) legs="$linux" ;;
            all) legs="$mac,$windows,$linux" ;;
          esac
          echo "matrix={\"include\":[$legs]}" >> "$GITHUB_OUTPUT"

  build:
    name: Preview (${{ needs.plan.outputs.slug }}, ${{ matrix.os }} ${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      INSTRUMENT_PREVIEW_NAME: ${{ needs.plan.outputs.slug }}

    steps:
      # See release.yml: keeps the packaged bytes identical on every platform.
      - if: runner.os == 'Windows'
        name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-binary-caches
      - uses: ./.github/actions/prepare
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - if: matrix.os == 'mac'
        name: setup-signing
        run: |
          mkdir -p ~/.private_keys
          echo '${{ secrets.APPLE_API_KEY_DATA }}' > ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      # Signed the way a release is, so SmartScreen treats the installer the
      # way it treats Instrument's. The same steps as release.yml.
      - if: matrix.os == 'windows'
        name: Add signtool to PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like '*\x64\*' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK." }
          Add-Content -Path $env:GITHUB_PATH -Value $signtool.DirectoryName
      - if: matrix.os == 'windows'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
      - if: matrix.os == 'windows'
        name: Install GCP KMS CNG Provider
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'cng-v1.2'
          $zipUrl  = "https://github.com/GoogleCloudPlatform/kms-integrations/releases/download/$version/kmscng-1.2-windows-amd64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "kmscng-$version.zip"
          $outDir  = Join-Path $env:RUNNER_TEMP "kmscng-$version"
          Invoke-WebRequest $zipUrl -OutFile $zipPath
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $outDir -Force
          $msi = Get-ChildItem -Path $outDir -Recurse -Filter "kmscng.msi" | Select-Object -First 1
          if (-not $msi) { throw "kmscng.msi not found in archive." }
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$($msi.FullName)`" /qn"
          certutil -csp "Google Cloud KMS Provider" -csptest
      - if: matrix.os == 'windows'
        name: Write EV Cert Chain File
        shell: pwsh
        run: |
          Set-Content -Path "${{ env.WIN_CERT_PATH }}" -Value '${{ env.WIN_EV_CERT_PEM }}' -Encoding ascii
        env:
          WIN_CERT_PATH: ${{ runner.temp }}\ev-chain.pem
          WIN_EV_CERT_PEM: ${{ secrets.WIN_EV_CERT_PEM }}

      - name: Build (vite)
        run: pnpm turbo run build:vite --filter=@instrument-org/studio
        env:
          MAIN_VITE_APP_API_BASE_URL: ${{ vars.MAIN_VITE_APP_API_BASE_URL }}

      # Retried for the same reason as the release job's Package Mac step: the
      # notary service drops the connection now and then.
      - if: matrix.os == 'mac'
        name: Package Mac
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @instrument-org/studio exec electron-builder --mac zip --arm64 --publish never; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Packaging attempt $attempt failed, retrying"
              sleep 30
            fi
          done
          exit 1
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY: ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_NOTARIZATION_ENABLED: ${{ vars.APPLE_NOTARIZATION_ENABLED }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          ARCH: arm64

      - if: matrix.os == 'mac'
        name: Verify the signed app starts
        run: pnpm --filter @instrument-org/studio run verify-packaged-app

      # TEST SEAM: the same preview packaged again at a higher version. Both
      # builds share one identity and signature, which Squirrel.Mac requires
      # of an update, so a test Mac can update one into the other (pointed at
      # a feed of its own with INSTRUMENT_TEST_UPDATE_FEED). The version is
      # all that changes; nothing is rebuilt but the package.
      - if: matrix.os == 'mac' && inputs.update_test_version
        name: Package Mac again at the test update version
        run: |
          first="$RUNNER_TEMP/first-build"
          mkdir -p "$first" apps/studio/dist-update
          mv apps/studio/dist/*.zip "$first/"
          node -e 'const f="apps/studio/package.json";const fs=require("fs");const p=JSON.parse(fs.readFileSync(f));p.version=process.env.UPDATE_TEST_VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
          for attempt in 1 2 3; do
            if pnpm --filter @instrument-org/studio exec electron-builder --mac zip --arm64 --publish never; then
              mv apps/studio/dist/*.zip apps/studio/dist-update/
              mv "$first"/*.zip apps/studio/dist/
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Packaging attempt $attempt failed, retrying"
              sleep 30
            fi
          done
          exit 1
        env:
          UPDATE_TEST_VERSION: ${{ inputs.update_test_version }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY: ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_NOTARIZATION_ENABLED: ${{ vars.APPLE_NOTARIZATION_ENABLED }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          ARCH: arm64

      - if: always() && matrix.os == 'mac'
        name: Cleanup Signing
        run: rm -f ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - if: matrix.os == 'windows'
        name: Package Windows
        run: pnpm --filter @instrument-org/studio exec electron-builder --win --x64 --publish never
        env:
          WIN_GCP_KMS_KEY_VERSION: ${{ secrets.WIN_GCP_KMS_KEY_VERSION }}
          WIN_CERT_PATH: ${{ runner.temp }}\ev-chain.pem

      # The Windows install and its updates are Velopack's: the unpacked app
      # electron-builder just signed, packed per channel with a delta from
      # each channel's last release (docs/architecture/releasing.md). vpk is
      # pinned to the velopack package the app loads.
      - if: matrix.os == 'windows'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - if: matrix.os == 'windows'
        name: Install vpk
        shell: pwsh
        run: |
          $version = node -p "require('./apps/studio/package.json').dependencies.velopack"
          dotnet tool install --global vpk --version $version
      - if: matrix.os == 'windows'
        name: Pack Velopack release
        run: node apps/studio/scripts/velopack-pack.ts --unpacked "apps/studio/dist/win-unpacked" --out "apps/studio/dist/velopack"
        env:
          WIN_GCP_KMS_KEY_VERSION: ${{ secrets.WIN_GCP_KMS_KEY_VERSION }}
          WIN_CERT_PATH: ${{ runner.temp }}\ev-chain.pem

      # Each version is packed for every channel it reaches, each with a
      # Setup; the one uploaded is the preview's own channel's.
      - if: matrix.os == 'windows'
        name: Find the Windows preview's channel
        id: channel
        shell: bash
        run: |
          echo "channel=$(node -p "(require('semver').prerelease(require('./package.json').version)?.[0]) ?? 'latest'")" >> "$GITHUB_OUTPUT"
        working-directory: apps/studio

      # TEST SEAM: the Windows half of the Mac step above. The app is packaged
      # again at the higher version and packed into a Velopack feed of its own,
      # with a delta from the first build's packages, so a test host pointed
      # at it (INSTRUMENT_TEST_UPDATE_FEED) updates one build into the other,
      # and an NSIS install of the first build moves onto Velopack from it.
      - if: matrix.os == 'windows' && inputs.update_test_version
        name: Package Windows again at the test update version
        shell: bash
        run: |
          node -e 'const f="apps/studio/package.json";const fs=require("fs");const p=JSON.parse(fs.readFileSync(f));p.version=process.env.UPDATE_TEST_VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
          pnpm --filter @instrument-org/studio exec electron-builder --win dir --x64 --publish never
          node apps/studio/scripts/velopack-pack.ts --unpacked "$ELECTRON_BUILDER_OUTPUT_DIR/win-unpacked" --out "apps/studio/dist/velopack-update" --feed "apps/studio/dist/velopack"
        env:
          ELECTRON_BUILDER_OUTPUT_DIR: ${{ runner.temp }}/dist-update
          UPDATE_TEST_VERSION: ${{ inputs.update_test_version }}
          WIN_GCP_KMS_KEY_VERSION: ${{ secrets.WIN_GCP_KMS_KEY_VERSION }}
          WIN_CERT_PATH: ${{ runner.temp }}\ev-chain.pem

      - if: matrix.os == 'linux'
        name: Package Linux
        run: pnpm --filter @instrument-org/studio exec electron-builder --linux --${{ matrix.arch }} --publish never

      # Each file is uploaded as itself rather than wrapped in another zip, so
      # a download is the app, its installer, or its archive. The file names
      # the artifact.
      - if: matrix.os == 'mac'
        name: Upload Mac preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: apps/studio/dist/*.zip
          retention-days: 30
          if-no-files-found: error
      - if: matrix.os == 'mac' && inputs.update_test_version
        name: Upload Mac test update
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: apps/studio/dist-update/*.zip
          retention-days: 7
          if-no-files-found: error
      - if: matrix.os == 'windows'
        name: Upload Windows preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: apps/studio/dist/*.exe
          retention-days: 30
          if-no-files-found: error
      # The same preview as a Velopack install, which updates the way a
      # release does when pointed at a feed of its own.
      - if: matrix.os == 'windows'
        name: Upload Windows Velopack Setup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: apps/studio/dist/velopack/*-${{ steps.channel.outputs.channel }}-Setup.exe
          retention-days: 30
          if-no-files-found: error
      # Both feeds whole, zipped: the first build's and the test update's,
      # which also lists the first build's packages and a delta from them.
      - if: matrix.os == 'windows' && inputs.update_test_version
        name: Upload Windows Velopack feeds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velopack-feeds
          path: |
            apps/studio/dist/velopack
            apps/studio/dist/velopack-update
          retention-days: 7
          if-no-files-found: error
      # The archive runs anywhere but needs a root-owned chrome-sandbox; the
      # AppImage runs as downloaded where fusermount is installed.
      - if: matrix.os == 'linux'
        name: Upload Linux archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: apps/studio/dist/*.tar.gz
          retention-days: 30
          if-no-files-found: error
      - if: matrix.os == 'linux'
        name: Upload Linux AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: apps/studio/dist/*.AppImage
          retention-days: 30
          if-no-files-found: error

  summarize:
    name: Summarize
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: |
          {
            echo "### Instrument Preview (${{ needs.plan.outputs.slug }})"
            echo
            echo "Built from \`${{ github.ref_name }}\` at \`${GITHUB_SHA:0:9}\`. Download a file under Artifacts below. From a terminal, \`gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts\` lists them, and \`gh api repos/${{ github.repository }}/actions/artifacts/<id>/zip > <file>\` fetches one as the file itself; \`gh run download\` expects every artifact to be a zip and fails on the others."
            echo
            echo "- **macOS:** unzip and open the app wherever it landed."
            echo "- **Windows:** run the installer. It installs beside Instrument, under its own name."
            echo "- **Linux:** unpack the archive and run the executable inside, or run the AppImage."
            echo
            echo "It never updates itself, and its developer mode is on. Its first launch is a first launch even on a machine that ran an earlier build of the same branch, since the run number is part of its identity."
          } >> "$GITHUB_STEP_SUMMARY"
