# The packages every chat's `python` imports without a `pip install`: the
# ones the agent reached for most in real chats and failed to import, for the
# charts, spreadsheets, PDFs and documents it is asked for most. The app
# installs them from `src/lib/python-base-requirements.ts`, which
# `script:lock-python-base` writes from this project's lockfile.
[project]
name = "instrument-python-base"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  # Reading web pages saved or fetched as HTML.
  "beautifulsoup4",
  # Charts, the most common failed import.
  "matplotlib",
  # Reading and writing .xlsx, and pandas' engine for it.
  "openpyxl",
  # CSV and table work, the most common kind of script; brings numpy.
  "pandas",
  # Text and tables out of a PDF.
  "pdfplumber",
  # Images: resizing, converting, thumbnails.
  "pillow",
  # Splitting, merging, filling and rotating PDFs.
  "pypdf",
  # Rendering PDF pages to images, under a permissive license (PyMuPDF is
  # AGPL).
  "pypdfium2",
  "python-docx",
  # Brings xlsxwriter.
  "python-pptx",
  # Writing a PDF from scratch.
  "reportlab",
]

[tool.uv]
# Releases a week old or more, the gate every install the agent runs is held to.
exclude-newer = "2026-10-08T00:00:00Z"
# pdfminer.six's dependency. 49 and later publish no Intel Mac wheel, and the
# app installs from wheels alone.
constraint-dependencies = ["cryptography<49"]
