description: "Cache downloaded binaries (ripgrep, electron, dugite, ffmpeg) to avoid repeated downloads"
name: "Setup binary caches"
outputs:
  cache-hit:
    description: "A boolean value to indicate if a cache was hit for ripgrep"
    value: ${{ steps.cache-ripgrep.outputs.cache-hit }}
runs:
  steps:
    - id: cache-ripgrep
      name: Cache @vscode/ripgrep bin
      uses: actions/cache@v5
      with:
        key: vscode-ripgrep-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        path: |
          node_modules/.pnpm/@vscode+ripgrep@*/node_modules/@vscode/ripgrep/bin/
          node_modules/@vscode/ripgrep/bin/
          /tmp/vscode-ripgrep-cache-*

    - name: Cache electron binary
      uses: actions/cache@v5
      with:
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        path: ~/.cache/electron

    - name: Cache dugite git binary
      uses: actions/cache@v5
      with:
        key: dugite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        path: node_modules/.pnpm/dugite@*/node_modules/dugite/git/

    - name: Cache ffmpeg/ffprobe binaries
      uses: actions/cache@v5
      with:
        key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        path: |
          ~/.cache/ffmpeg-static-nodejs
          ~/.cache/ffprobe-static-nodejs
  using: "composite"
