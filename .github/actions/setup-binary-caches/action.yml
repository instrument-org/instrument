description: "Cache large binary downloads (electron, dugite, ffmpeg, uutils) to skip re-downloading on repeated runs"
name: "Setup binary caches"
runs:
  steps:
    - name: Cache electron binary
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'apps/studio/package.json') }}
        path: ~/.cache/electron/

    - name: Cache dugite git binary
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        key: dugite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        path: ~/.cache/dugite/

    - name: Cache ffmpeg/ffprobe binaries
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        path: |
          ~/.cache/ffmpeg-ffprobe-static-nodejs
          ~/Library/Caches/ffmpeg-ffprobe-static-nodejs
          ~/AppData/Local/ffmpeg-ffprobe-static-nodejs/Cache

    # download-uutils.ts pins every archive by sha256 and skips when the
    # vendored folder's marker matches, so the folder itself is the cache.
    - name: Cache uutils binaries
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        key: uutils-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/studio/scripts/download-uutils.ts') }}
        path: apps/studio/resources/uutils
  using: "composite"
