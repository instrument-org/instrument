packages:
  - packages/*
  - apps/*

allowBuilds:
  "@derhuerst/ffprobe-static": true
  "@parcel/watcher": false
  "@posthog/cli": true
  "@swc/core": true
  "@vscode/ripgrep": true
  agent-browser: true
  better-sqlite3: false
  core-js: true
  dugite: true
  electron: true
  electron-winstaller: true
  esbuild: true
  ffmpeg-static: true
  msw: true
  protobufjs: true
  sharp: true
  tree-sitter-javascript: true
  unrs-resolver: true
blockExoticSubdeps: true

catalog:
  "@orpc/client": ^1.14.3
  "@orpc/contract": ^1.14.3
  "@orpc/server": ^1.14.3
  "@orpc/shared": ^1.14.3
  "@orpc/tanstack-query": ^1.14.3
  "@types/node": 24.13.1
  "@types/react": ^19.2.7
  "@types/react-dom": ^19.2.3
  "@typescript/native-preview": 7.0.0-dev.20260702.3
  "@vitejs/plugin-react": ^5.1.2
  ai: ^6.0.168
  better-auth: ^1.2.12
  hono: ^4.7.8
  react: ^19.2.1
  react-dom: ^19.2.1
  typescript: 5.9.2
  typescript-result: ^3.5.2
  vite: ^7.2.7
  vitest: ^4.1.10
  zod: ^4.1.13

ignoredOptionalDependencies:
  - "@mongodb-js/zstd"
  - better-sqlite3
  - node-liblzma

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - agent-browser

overrides:
  "@electron/rebuild>node-abi": 4.31.0
  # Collapse hono to the version the workspace server is written against. The
  # MCP SDK depends on @hono/node-server@1, whose hono peer otherwise resolves to
  # a second copy, and deduping that one drags the server's own copy up with it.
  # Only the SDK's client transports are used here, never its server helpers.
  hono: 4.8.5
  # Collapse jiti to a single version so vite (which has jiti as an optional
  # peer) resolves to one peer-variant. Two jiti versions otherwise spawn two
  # vite@7 variants, making Plugin types "unrelated" and breaking tsgo on
  # electron.vite.config.ts.
  jiti: 2.7.0

patchedDependencies:
  "@parcel/watcher@2.5.1": patches/@parcel__watcher@2.5.1.patch
  conf@14.0.0: patches/conf@14.0.0.patch

sideEffectsCache: false

# pnpm 11 defaults this to "install", so every `pnpm run`/`pnpm exec` verifies
# the store first and silently spawns an install when it looks stale. With
# long-running dev servers and several agents sharing one store, those implicit
# installs race and deadlock. "false" restores the pnpm 10 behavior: run the
# command as asked, install only when asked.
verifyDepsBeforeRun: false
