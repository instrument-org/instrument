env:
  CI: "true"
  DO_NOT_TRACK: "1"
  NODE_OPTIONS: "--max_old_space_size=4096"
jobs:
  check:
    name: Check and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # FIXME rename "registry"
          submodules: recursive # Some tests use the registry
      - uses: ./.github/actions/setup-binary-caches
      - uses: ./.github/actions/prepare
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: rharkor/caching-for-turbo@v2.3.11
        env:
          # Remove once https://github.com/rharkor/caching-for-turbo/issues/829 is resolved
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      - run: pnpm check-and-test

name: CI

on:
  pull_request: ~
  push:
    branches:
      - main
