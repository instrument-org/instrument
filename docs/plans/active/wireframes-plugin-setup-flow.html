<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title and the version digit on the favicon are set from VERSION at the
         end of the body. Leave both placeholders alone. -->
    <title>Wireframe</title>
    <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg/%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
      rel="stylesheet"
      type="text/css"
    />
    <style type="text/tailwindcss">
      @import "tailwindcss";

      /* Studio's light theme, resolved from
         apps/studio/src/client/styles/globals.css. Regenerate with the command
         in SKILL.md rather than editing by hand. */
      @theme {
        /* sync:start */
        --font-sans: "Work Sans", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono Variable", "JetBrains Mono", ui-monospace, monospace;

        --radius: 0.5rem;
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);

        --shadow-sm: 0 2px 4px 0 rgb(10 13 18 / 0.04), 0 1px 2px -1px rgb(10 13 18 / 0.06), 0 0 0 1px rgb(10 13 18 / 0.06);
        --shadow-xl: 0 12px 24px -4px rgb(10 13 18 / 0.07), 0 6px 10px -6px rgb(10 13 18 / 0.07), 0 0 0 1px rgb(10 13 18 / 0.06);

        --color-gray-25: #fdfdfc;
        --color-gray-50: #fafaf9;
        --color-gray-100: #f5f5f4;
        --color-gray-200: #e7e5e4;
        --color-gray-300: #d7d3d0;
        --color-gray-400: #a9a29d;
        --color-gray-500: #79716b;
        --color-gray-600: #57534e;
        --color-gray-700: #44403c;
        --color-gray-800: #292524;
        --color-gray-900: #1c1917;
        --color-gray-950: #171412;

        --color-brand-25: #f1f4f2;
        --color-brand-50: #e2eae7;
        --color-brand-100: #c5d5d0;
        --color-brand-200: #9dbfb6;
        --color-brand-300: #6ca89c;
        --color-brand-400: #338c81;
        --color-brand-500: #0e7869;
        --color-brand-600: #0b6056;
        --color-brand-700: #0a4a42;
        --color-brand-800: #093a34;
        --color-brand-900: #082c28;
        --color-brand-950: #051b18;

        --color-error-50: #fbeef0;
        --color-error-100: #f8e4e8;
        --color-error-300: #e197a6;
        --color-error-500: #b4324f;
        --color-error-700: #7a1f30;
        --color-error-900: #3f121a;

        --color-warning-50: #fffaeb;
        --color-warning-100: #fef0c7;
        --color-warning-300: #fec84b;
        --color-warning-500: #f79009;
        --color-warning-700: #b54708;
        --color-warning-900: #7a2e0e;

        --color-success-50: #e9f5eb;
        --color-success-100: #d9f1db;
        --color-success-300: #7dcb87;
        --color-success-500: #29a845;
        --color-success-700: #176229;
        --color-success-900: #0b3216;

        --color-yellow-50: #fdf6e2;
        --color-yellow-100: #fbebc9;
        --color-yellow-300: #f1cc8e;
        --color-yellow-500: #d58f4f;
        --color-yellow-700: #b26747;
        --color-yellow-900: #59301e;

        --color-brown-50: #fcfbf8;
        --color-brown-100: #f6f4f0;
        --color-brown-300: #e8e3da;
        --color-brown-500: #bbaa8e;
        --color-brown-700: #937b5b;
        --color-brown-900: #564538;

        --color-background: #fafaf9;
        --color-foreground: #171412;
        --color-card: #ffffff;
        --color-popover: #ffffff;
        --color-primary: #171412;
        --color-primary-foreground: #ffffff;
        --color-secondary: #f5f5f4;
        --color-secondary-foreground: #292524;
        --color-muted: #f5f5f4;
        --color-muted-foreground: #79716b;
        --color-accent: #e7e5e4;
        --color-accent-foreground: #292524;
        --color-destructive: #b4324f;
        --color-border: #e7e5e4;
        --color-input: #e7e5e4;
        --color-ring: #a9a29d;
        /* sync:end */
      }
    </style>

    <style>
      /* A frame is drawn once at true size and shown at whatever scale fits.
         transform, not zoom: zoom re-runs layout at the smaller size, so text
         re-wraps and the miniature stops matching the thing it depicts. */
      .frame {
        width: calc(var(--w) * var(--s));
        height: calc(var(--h) * var(--s));
        overflow: hidden;
        cursor: zoom-in;
      }
      .frame > * {
        width: var(--w);
        height: var(--h);
        transform: scale(var(--s));
        transform-origin: top left;
      }

      /* A real grid, not wrapped flex: cards in a row share a height, so
         captions line up and no tile bleeds into its neighbour. */
      body {
        overflow-anchor: none;
      }
      #rack {
        display: grid;
        grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
        gap: 1.25rem;
      }

      /* One small floating bar carries what you need to know and the only
         control worth having. Everything else is canvas. */

      dialog.viewer {
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        place-items: center;
      }
      dialog.viewer[open] {
        display: grid;
      }
      dialog.viewer::backdrop {
        background: rgb(23 20 18 / 0.6);
      }
      /* The enlarged frame stays interactive: only the backdrop dismisses. */
      dialog.viewer .frame {
        cursor: default;
      }
      @media print {
        * {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-gray-100 font-sans text-sm text-foreground antialiased">
    <div
      id="hud"
      class="fixed top-4 left-4 z-20 flex max-w-[min(38rem,calc(100vw-2rem))] items-center gap-3 rounded-xl border border-border bg-white/95 px-3 py-2 shadow-sm backdrop-blur"
    >
      <div class="min-w-0">
        <h1 class="truncate text-[13px] leading-tight font-semibold">Setting up a plugin, in context</h1>
        <p id="subtitle" class="truncate text-[11px] leading-tight text-muted-foreground"></p>
      </div>
      <span id="count" class="shrink-0 border-l border-border pl-3 text-[11px] whitespace-nowrap text-muted-foreground"></span>
      <div id="views" class="flex shrink-0 items-center gap-0.5 rounded-lg bg-gray-200/70 p-0.5"></div>
    </div>

    <main>
      <div id="rack" class="p-6 pt-[4.75rem]"></div>
    </main>

    <dialog class="viewer"></dialog>

    <script>
      const VERSION = "1";
      const SUBTITLE = "Plugins · setup";
      const W = 1280;
      const H = 800;

      // ---- shared pieces ---------------------------------------------------
      // Class names are always written out whole. Building them by
      // interpolation hides them from Tailwind's scanner and they produce
      // no styles.
      const bars = (...widths) =>
        widths.map((w) => `<div class="h-2.5 rounded-full bg-gray-300" style="width:${w}"></div>`).join("");

      const navItem = (label, { active = false, dot = "" } = {}) => `
        <div class="flex items-center gap-2 rounded-md px-3 py-2 ${active ? "bg-gray-200" : ""}">
          ${dot ? `<span class="size-2 shrink-0 rounded-full ${dot}"></span>` : ""}
          <span class="text-[15px] ${active ? "font-medium" : "text-muted-foreground"}">${label}</span>
        </div>`;

      const step = (icon, text) => `
        <div class="mt-2.5 flex items-center gap-2.5 rounded-lg border border-border bg-white px-3.5 py-2">
          <i class="ph ${icon} text-base text-muted-foreground"></i>
          <span class="text-sm text-muted-foreground">${text}</span>
        </div>`;

      const composer = (inner) => `
        <div class="absolute inset-x-8 bottom-8"><div class="mx-auto max-w-2xl">${inner}</div></div>`;

      const emptyComposer = ({ live = true, placeholder = "" } = {}) => `
        <div class="grid h-20 grid-rows-[1fr_auto] rounded-[20px] bg-white p-4 shadow-sm">
          ${placeholder ? `<span class="text-sm text-gray-400">${placeholder}</span>` : `<div class="h-2.5 w-32 rounded-full bg-gray-300"></div>`}
          <div class="flex items-center justify-between pt-2">
            <i class="ph ph-plus text-lg text-muted-foreground"></i>
            <div class="grid size-8 place-items-center rounded-full ${live ? "bg-gray-900" : "bg-gray-300"}">
              <i class="ph ${live ? "ph-stop" : "ph-arrow-up"} text-sm text-white"></i>
            </div>
          </div>
        </div>`;

      const window_ = (side, main, right = "") => `
        <div class="flex h-full bg-gray-50">
          <aside class="w-64 shrink-0 border-r border-border bg-gray-100/70 p-4">
            <div class="mb-4 h-9 rounded-lg bg-gray-200/70"></div>
            ${side}
          </aside>
          <section class="relative min-w-0 flex-1 p-8">${main}</section>
          ${right ? `<aside class="w-[420px] shrink-0 border-l border-border bg-white">${right}</aside>` : ""}
        </div>`;

      // ---- the four states -------------------------------------------------
      const states = [
        {
          title: "Working",
          note: "Setup is ordinary work in the ordinary place. No wizard, and the plugin folder is a real thing you could open.",
          titleClass: "text-foreground",
          body: window_(
            navItem("Connect my Linear", { active: true }) + navItem("Q3 report draft") + navItem("Invoice cleanup"),
            `<div class="mx-auto max-w-2xl">
               <div class="flex justify-end">
                 <div class="inline-block max-w-[80%] rounded-tl-xl rounded-tr-sm rounded-br-xl rounded-bl-xl bg-linear-to-b from-card to-gray-25 px-4 py-2.5 shadow-sm">
                   <span class="text-sm">Connect my Linear so you can see my issues</span>
                 </div>
               </div>
               <div class="mt-5 space-y-2.5">${bars("100%", "76%")}</div>
               ${step("ph-magnifying-glass", "Searching installed plugins for <span class='font-mono text-xs'>linear</span>")}
               ${step("ph-file-plus", "Copied a template into <span class='font-mono text-xs'>/plugins/linear</span>")}
             </div>
             ${composer(emptyComposer())}`,
          ),
        },
        {
          title: "It needs something only you have",
          note: "The request takes the composer's place, so it cannot be scrolled away from. An alternative route stays visible.",
          titleClass: "text-warning-700",
          body: window_(
            navItem("Connect my Linear", { active: true, dot: "bg-warning-500" }) + navItem("Q3 report draft"),
            `<div class="mx-auto max-w-2xl">
               <div class="space-y-2.5">${bars("100%", "64%")}</div>
               ${step("ph-check", "Linear has an MCP server. Using it.")}
             </div>
             ${composer(`
               <div class="rounded-[20px] bg-white p-5 ring-1 ring-gray-900/10 shadow-sm">
                 <div class="flex items-start gap-3">
                   <i class="ph ph-signature mt-0.5 text-xl text-gray-700"></i>
                   <div class="min-w-0 flex-1">
                     <p class="text-[15px] font-medium">Sign in to Linear</p>
                     <p class="mt-0.5 text-sm leading-5 text-muted-foreground">Opens Linear's own sign-in beside this conversation. Nothing leaves your Mac.</p>
                   </div>
                 </div>
                 <div class="mt-4 flex items-center justify-between">
                   <span class="text-xs text-muted-foreground">Rather paste an API key?</span>
                   <div class="flex items-center gap-2">
                     <span class="rounded-md px-3 py-1.5 text-sm font-medium text-muted-foreground">Not now</span>
                     <span class="rounded-md bg-gray-900 px-3.5 py-1.5 text-sm font-medium text-white">Open sign-in</span>
                   </div>
                 </div>
               </div>`)}`,
          ),
        },
        {
          title: "The provider's own page, beside the work",
          note: "Sign-in happens in the panel the browser already lives in, never the user's own browser. The reason for the prompt stays on screen.",
          titleClass: "text-foreground",
          body: window_(
            navItem("Connect my Linear", { active: true, dot: "bg-warning-500" }),
            `<div class="mx-auto max-w-lg">
               <div class="space-y-2.5">${bars("100%", "58%")}</div>
             </div>
             ${composer(`
               <div class="flex items-center gap-3 rounded-[20px] bg-white p-5 ring-1 ring-gray-900/10 shadow-sm">
                 <i class="ph ph-circle-notch text-lg text-muted-foreground"></i>
                 <div class="min-w-0">
                   <p class="text-sm font-medium">Waiting for you to finish signing in</p>
                   <p class="text-xs text-muted-foreground">Cancel to try an API key instead</p>
                 </div>
               </div>`)}`,
            `<div class="flex items-center gap-2 border-b border-border px-4 py-2.5">
               <i class="ph ph-lock-simple text-xs text-success-500"></i>
               <span class="truncate font-mono text-xs text-muted-foreground">linear.app/oauth/authorize</span>
             </div>
             <div class="p-8">
               <div class="mx-auto mt-8 w-72 rounded-xl border border-border p-6 shadow-sm">
                 <div class="mx-auto size-10 rounded-lg bg-gray-900"></div>
                 <p class="mt-4 text-center text-sm font-medium">Instrument wants access</p>
                 <div class="mt-4 space-y-2">
                   <div class="flex items-center gap-2"><i class="ph ph-check text-xs text-success-500"></i><span class="text-xs text-muted-foreground">Read your issues</span></div>
                   <div class="flex items-center gap-2"><i class="ph ph-check text-xs text-success-500"></i><span class="text-xs text-muted-foreground">Read your teams</span></div>
                 </div>
                 <div class="mt-5 rounded-md bg-gray-900 py-2 text-center text-xs font-medium text-white">Authorize</div>
               </div>
             </div>`,
          ),
        },
        {
          title: "Connected, and named",
          note: "The task finishes what it was asked to do rather than stopping at connected. The connection carries a name you will recognize later.",
          titleClass: "text-success-700",
          body: window_(
            navItem("Connect my Linear", { active: true }) + navItem("Q3 report draft"),
            `<div class="mx-auto max-w-2xl">
               <div class="inline-flex items-center gap-2 rounded-lg border border-border bg-white px-3.5 py-2">
                 <i class="ph-fill ph-check-circle text-base text-success-500"></i>
                 <span class="text-sm">Connected Linear as <span class="font-medium">Work</span></span>
               </div>
               <div class="mt-4 space-y-2.5">${bars("100%", "88%")}</div>
               <div class="mt-4 rounded-xl border border-border bg-white p-4">
                 <div class="mb-3 flex items-center gap-2">
                   <i class="ph ph-table text-base text-muted-foreground"></i>
                   <span class="text-sm font-medium">6 issues assigned to you</span>
                 </div>
                 <div class="space-y-2">${bars("100%", "92%", "70%", "84%")}</div>
               </div>
             </div>
             ${composer(emptyComposer({ live: false, placeholder: "Reply to Instrument" }))}`,
          ),
        },
      ];

      // ---- render ----------------------------------------------------------
      const rack = document.querySelector("#rack");

      rack.innerHTML = states
        .map(
          (state, i) => `
        <figure class="tile m-0 flex flex-col overflow-hidden rounded-xl bg-white p-3 shadow-sm">
          <div class="frame self-center overflow-hidden rounded-lg ring-1 ring-black/5" data-label="${i + 1} · ${state.title}" data-w="${state.w || W}" data-h="${state.h || H}" style="--w:${state.w || W}px; --h:${state.h || H}px">
            <div>${state.body}</div>
          </div>
          <figcaption class="mt-3 flex-1 text-xs leading-5 text-muted-foreground">
            <span class="mr-1.5 rounded bg-gray-100 px-1.5 py-0.5 font-mono text-[10px] text-gray-600">${i + 1}</span><span class="font-medium ${state.titleClass}">${state.title}.</span> ${state.note}
          </figcaption>
        </figure>`,
        )
        .join("");

      document.querySelector("#count").textContent = `${states.length} frames`;

      document.querySelector("#subtitle").textContent = SUBTITLE;

      // ---- density ---------------------------------------------------------
      // Fit as many tiles per row as the width allows, then derive the scale
      // from the tile. Frames never render above their true size.
      const TILE_MIN = 330;
      const GAP = 20;
      const PAD = 26; // card padding plus borders
      let single = false;

      const layout = () => {
        const avail = rack.clientWidth - 48;
        if (avail <= 0) return;
        const columns = single ? 1 : Math.max(1, Math.floor((avail + GAP) / (TILE_MIN + GAP)));
        const inner = (avail - GAP * (columns - 1)) / columns - PAD;
        rack.style.setProperty("--cols", columns);
        for (const frame of rack.querySelectorAll(".frame")) {
          frame.style.setProperty("--s", Math.max(0.05, Math.min(inner / Number(frame.dataset.w), 1)));
        }
      };

      new ResizeObserver(layout).observe(rack);
      layout();

      // ---- view mode -------------------------------------------------------
      const VIEWS = [
        ["grid", "ph-squares-four", "Grid"],
        ["single", "ph-rows", "One per row"],
      ];
      const viewBox = document.querySelector("#views");

      const paintViews = () => {
        viewBox.innerHTML = VIEWS.map(
          ([key, icon, title]) => `
          <button data-view="${key}" title="${title}" class="grid size-7 place-items-center rounded-md ${
            (key === "single") === single ? "bg-white text-foreground shadow-sm" : "text-muted-foreground"
          }"><i class="ph ${icon}"></i></button>`,
        ).join("");
      };
      paintViews();

      viewBox.addEventListener("click", (event) => {
        const button = event.target.closest("[data-view]");
        if (!button) return;
        single = button.dataset.view === "single";
        paintViews();
        layout();
      });

      // ---- enlarge ---------------------------------------------------------
      const viewer = document.querySelector("dialog.viewer");

      rack.addEventListener("click", (event) => {
        const frame = event.target.closest(".frame");
        if (!frame) return;
        const clone = frame.cloneNode(true);
        clone.style.setProperty(
          "--s",
          Math.min((innerWidth * 0.95) / Number(frame.dataset.w), (innerHeight * 0.95) / Number(frame.dataset.h)),
        );
        const label = document.createElement("p");
        label.className = "mt-3 text-center text-xs text-white/70";
        label.textContent = frame.dataset.label;
        const stack = document.createElement("div");
        stack.append(clone, label);
        viewer.replaceChildren(stack);
        viewer.showModal();
      });

      viewer.addEventListener("click", (event) => {
        if (event.target === viewer) viewer.close();
      });

      // ---- tab identity ----------------------------------------------------
      const heading = document.querySelector("h1").textContent.trim();
      document.title = `v${VERSION} · ${heading}`;
      document.querySelector("#favicon").href =
        "data:image/svg+xml," +
        encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0e7869"/><text x="16" y="24" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#ffffff">${VERSION}</text></svg>`,
        );
    </script>
  </body>
</html>
