description: Injects PostHog chunk IDs into built assets and uploads source maps

inputs:
  api-key:
    description: PostHog CLI API key
    required: true
  project-id:
    description: PostHog project ID
    required: true
  version:
    description: Release version (e.g. git tag)
    required: false

name: Upload Source Maps to PostHog
runs:
  steps:
    - env:
        POSTHOG_CLI_API_KEY: ${{ inputs.api-key }}
        POSTHOG_CLI_PROJECT_ID: ${{ inputs.project-id }}
      name: Upload source maps
      run: |
        pnpm exec posthog-cli sourcemap process --directory "apps/studio/out" --release-name "instrument"${{ inputs.version != '' && format(' --release-version "{0}"', inputs.version) || '' }}
      shell: bash
  using: composite
