env:
  CI: "true"
  DO_NOT_TRACK: "1"
  NODE_OPTIONS: "--max_old_space_size=4096"
jobs:
  check:
    name: Check and Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # FIXME rename "registry"
          submodules: recursive # Some tests use the registry
      - uses: ./.github/actions/setup-binary-caches
      - uses: ./.github/actions/prepare
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm check-and-test

concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ci-${{ github.ref }}

name: CI

on:
  pull_request: ~
  push:
    branches:
      - main
