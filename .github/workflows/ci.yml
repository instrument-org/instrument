env:
  CI: "true"
  DO_NOT_TRACK: "1"
  NODE_OPTIONS: "--max_old_space_size=4096"
jobs:
  check:
    name: Check and Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # FIXME rename "registry"
          submodules: recursive # Some tests use the registry
      - uses: ./.github/actions/setup-binary-caches
      - uses: ./.github/actions/prepare
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm check-and-test:ci

  # Its own job so the Chromium download never sits in front of everything else,
  # and so a flake here reads as a browser failure rather than as the whole
  # check being red.
  browser:
    env:
      # Workspace-local rather than the default `~/.cache/ms-playwright`, so the
      # cache step below can restore it by path.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    name: Browser Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/prepare
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: browser-cache
        name: Cache Chromium
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ${{ github.workspace }}/.playwright-browsers
      # The shared libraries Chromium links against are installed into the
      # runner, not into the cached directory, so this runs on a cache hit too.
      - name: Install Chromium system dependencies
        run: pnpm --filter @instrument-org/studio exec playwright install-deps chromium
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        name: Install Chromium
        run: pnpm --filter @instrument-org/studio exec playwright install chromium
      - run: pnpm --filter @instrument-org/studio run test:browser
      - if: ${{ !cancelled() }}
        name: Upload failure screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: browser-test-failures-${{ github.run_attempt }}
          path: |
            apps/studio/.vitest-attachments
            apps/studio/src/**/__screenshots__
          retention-days: 7

concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ci-${{ github.ref }}

name: CI

on:
  pull_request: ~
  push:
    branches:
      - main
