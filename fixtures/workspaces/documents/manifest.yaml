description: >-
  A chat whose task produced a document, for the surfaces that render one: the
  file chip in a reply, the files grid, and the document viewer.

# Developer mode gates `window.__studioDebug.rpc`, so a fixture meant to be
# driven through the debug routes pins it rather than relying on the dev build's
# default. (The `__studioDrive` handle is not gated on it -- that one ships only
# in a dev build.) Nothing else is pinned: every other preference and every
# feature flag falls through to the app's defaults, which is what keeps this
# fixture from breaking each time one of them moves.
settings:
  preferences:
    developerMode: true

chats:
  - key: red-and-blue-squares
    name: Red and blue squares PDF
    agedMinutes: 12
    # The task handed the PDF over in the user's Instrument folder, as a task
    # does today, so the chat's reply names /mnt/Instrument/…; that folder is
    # made beside the workspace with the file in it.
    folders:
      - mount: Instrument
        files:
          - from: red-blue-squares-centered.pdf
            to: red-blue-squares/red-blue-squares-centered.pdf
    tasks:
      - key: generated-pdf
        name: Red and blue squares PDF
        agedMinutes: 13
        folders: [Instrument]
        # Written by the run this transcript was recorded from, and committed
        # rather than regenerated: what the task's transcript reads and writes
        # has to be in the seeded task.
        files:
          - from: create_red_blue_squares.py
            to: work/create_red_blue_squares.py
          - from: red-blue-squares.pdf
            to: work/red-blue-squares.pdf
          - from: red-blue-squares-saved-check.pdf
            to: work/red-blue-squares-saved-check.pdf
          - from: page-001.png
            to: work/red-blue-squares-preview/page-001.png
