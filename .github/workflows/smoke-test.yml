name: Smoke Test

on:
  workflow_dispatch:
    inputs: {}
  workflow_call: {}

env:
  DO_NOT_TRACK: "1"
  MAIN_VITE_APP_API_BASE_URL: ${{ vars.MAIN_VITE_APP_API_BASE_URL }}
  MAIN_VITE_GOOGLE_CLIENT_ID: intentionally-invalid-client-id
  MAIN_VITE_GOOGLE_CLIENT_SECRET: intentionally-invalid-client-secret
  VITE_POSTHOG_API_HOST: intentionally-invalid-api-host
  VITE_POSTHOG_API_KEY: intentionally-invalid-api-key

jobs:
  smoke_test:
    name: Studio Smoke Test
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-binary-caches
      - uses: ./.github/actions/prepare
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Start Xvfb
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - if: runner.os == 'macOS'
        name: Select Xcode 26 (actool for icon.icon)
        uses: ./.github/actions/select-xcode-26
      - name: Build and run smoke test
        run: pnpm turbo run smoke-test
      - name: Upload smoke test screenshots
        if: always()
        id: upload-screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-screenshots-${{ runner.os }}
          path: apps/studio/smoke-test-screenshots/*.png
          if-no-files-found: ignore
      - name: Summarize smoke test screenshots
        if: always()
        shell: bash
        run: |
          SCREENSHOTS_DIR="apps/studio/smoke-test-screenshots"
          PNGS=("$SCREENSHOTS_DIR"/*.png)
          if [ ! -e "${PNGS[0]}" ]; then
            echo "No screenshots captured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Smoke Test Screenshots (${{ runner.os }})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            ARTIFACT_URL="${{ steps.upload-screenshots.outputs.artifact-url }}"
            if [ -n "$ARTIFACT_URL" ]; then
              echo "[View all screenshots]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
            for f in "${PNGS[@]}"; do
              echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
