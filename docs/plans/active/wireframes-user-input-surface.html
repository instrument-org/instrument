<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title and the version digit on the favicon are set from VERSION at the
         end of the body. Leave both placeholders alone. -->
    <title>Wireframe</title>
    <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg/%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
      rel="stylesheet"
      type="text/css"
    />
    <style type="text/tailwindcss">
      @import "tailwindcss";

      /* Studio's light theme, resolved from
         apps/studio/src/client/styles/globals.css. Regenerate with the command
         in SKILL.md rather than editing by hand. */
      @theme {
        /* sync:start */
        --font-sans: "Work Sans", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono Variable", "JetBrains Mono", ui-monospace, monospace;

        --radius: 0.5rem;
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);

        --shadow-sm: 0 2px 4px 0 rgb(10 13 18 / 0.04), 0 1px 2px -1px rgb(10 13 18 / 0.06), 0 0 0 1px rgb(10 13 18 / 0.06);
        --shadow-xl: 0 12px 24px -4px rgb(10 13 18 / 0.07), 0 6px 10px -6px rgb(10 13 18 / 0.07), 0 0 0 1px rgb(10 13 18 / 0.06);

        --color-gray-25: #fdfdfc;
        --color-gray-50: #fafaf9;
        --color-gray-100: #f5f5f4;
        --color-gray-200: #e7e5e4;
        --color-gray-300: #d7d3d0;
        --color-gray-400: #a9a29d;
        --color-gray-500: #79716b;
        --color-gray-600: #57534e;
        --color-gray-700: #44403c;
        --color-gray-800: #292524;
        --color-gray-900: #1c1917;
        --color-gray-950: #171412;

        --color-brand-25: #f1f4f2;
        --color-brand-50: #e2eae7;
        --color-brand-100: #c5d5d0;
        --color-brand-200: #9dbfb6;
        --color-brand-300: #6ca89c;
        --color-brand-400: #338c81;
        --color-brand-500: #0e7869;
        --color-brand-600: #0b6056;
        --color-brand-700: #0a4a42;
        --color-brand-800: #093a34;
        --color-brand-900: #082c28;
        --color-brand-950: #051b18;

        --color-error-50: #fbeef0;
        --color-error-100: #f8e4e8;
        --color-error-300: #e197a6;
        --color-error-500: #b4324f;
        --color-error-700: #7a1f30;
        --color-error-900: #3f121a;

        --color-warning-50: #fffaeb;
        --color-warning-100: #fef0c7;
        --color-warning-300: #fec84b;
        --color-warning-500: #f79009;
        --color-warning-700: #b54708;
        --color-warning-900: #7a2e0e;

        --color-success-50: #e9f5eb;
        --color-success-100: #d9f1db;
        --color-success-300: #7dcb87;
        --color-success-500: #29a845;
        --color-success-700: #176229;
        --color-success-900: #0b3216;

        --color-yellow-50: #fdf6e2;
        --color-yellow-100: #fbebc9;
        --color-yellow-300: #f1cc8e;
        --color-yellow-500: #d58f4f;
        --color-yellow-700: #b26747;
        --color-yellow-900: #59301e;

        --color-brown-50: #fcfbf8;
        --color-brown-100: #f6f4f0;
        --color-brown-300: #e8e3da;
        --color-brown-500: #bbaa8e;
        --color-brown-700: #937b5b;
        --color-brown-900: #564538;

        --color-background: #fafaf9;
        --color-foreground: #171412;
        --color-card: #ffffff;
        --color-popover: #ffffff;
        --color-primary: #171412;
        --color-primary-foreground: #ffffff;
        --color-secondary: #f5f5f4;
        --color-secondary-foreground: #292524;
        --color-muted: #f5f5f4;
        --color-muted-foreground: #79716b;
        --color-accent: #e7e5e4;
        --color-accent-foreground: #292524;
        --color-destructive: #b4324f;
        --color-border: #e7e5e4;
        --color-input: #e7e5e4;
        --color-ring: #a9a29d;
        /* sync:end */
      }
    </style>

    <style>
      /* A frame is drawn once at true size and shown at whatever scale fits.
         transform, not zoom: zoom re-runs layout at the smaller size, so text
         re-wraps and the miniature stops matching the thing it depicts. */
      .frame {
        width: calc(var(--w) * var(--s));
        height: calc(var(--h) * var(--s));
        overflow: hidden;
        cursor: zoom-in;
      }
      .frame > * {
        width: var(--w);
        height: var(--h);
        transform: scale(var(--s));
        transform-origin: top left;
      }

      /* A real grid, not wrapped flex: cards in a row share a height, so
         captions line up and no tile bleeds into its neighbour. */
      #rack {
        display: grid;
        grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
        gap: 1.25rem;
      }
      .tile {
        scroll-margin-top: 5rem;
      }

      /* One small floating bar carries what you need to know and the only
         control worth having. Everything else is canvas. */

      dialog.viewer {
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        place-items: center;
      }
      dialog.viewer[open] {
        display: grid;
      }
      dialog.viewer::backdrop {
        background: rgb(23 20 18 / 0.6);
      }
      /* The enlarged frame stays interactive: only the backdrop dismisses. */
      dialog.viewer .frame {
        cursor: default;
      }
      @media print {
        * {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-gray-100 font-sans text-sm text-foreground antialiased">
    <div
      id="hud"
      class="fixed top-4 left-4 z-20 flex max-w-[min(38rem,calc(100vw-2rem))] items-center gap-3 rounded-xl border border-border bg-white/95 px-3 py-2 shadow-sm backdrop-blur"
    >
      <div class="min-w-0">
        <h1 class="truncate text-[13px] leading-tight font-semibold">Where the agent asks the user for something</h1>
        <p id="subtitle" class="truncate text-[11px] leading-tight text-muted-foreground"></p>
      </div>
      <span id="count" class="shrink-0 border-l border-border pl-3 text-[11px] whitespace-nowrap text-muted-foreground"></span>
      <div id="views" class="flex shrink-0 items-center gap-0.5 rounded-lg bg-gray-200/70 p-0.5"></div>
    </div>

    <main>
      <div id="rack" class="p-6 pt-[4.75rem]"></div>
    </main>

    <dialog class="viewer"></dialog>

    <script>
      const VERSION = "1";
      const SUBTITLE = "Plugins · asking for input";
      const W = 1280;
      const H = 800;

      // ---- shared pieces ---------------------------------------------------
      // Class names are always written out whole. Building them by
      // interpolation hides them from Tailwind's scanner and they produce
      // no styles.
      const bars = (...widths) =>
        widths.map((w) => `<div class="h-2.5 rounded-full bg-gray-300" style="width:${w}"></div>`).join("");

      // The conversation column on its own, which is the only part of the
      // window this question is about.
      const column = (inner, docked) => `
        <div class="relative h-full bg-gray-50 p-6">
          <div class="space-y-3">${inner}</div>
          <div class="absolute inset-x-6 bottom-6">${docked}</div>
        </div>`;

      const bubble = (text) => `
        <div class="flex justify-end">
          <div class="inline-block max-w-[80%] rounded-tl-xl rounded-tr-sm rounded-br-xl rounded-bl-xl bg-linear-to-b from-card to-gray-25 px-4 py-2.5 shadow-sm">
            <span class="text-sm">${text}</span>
          </div>
        </div>`;

      const liveComposer = () => `
        <div class="grid h-[70px] grid-rows-[1fr_auto] rounded-[20px] bg-white p-4 shadow-sm">
          <div class="h-2.5 w-28 rounded-full bg-gray-300"></div>
          <div class="flex items-center justify-between pt-1">
            <i class="ph ph-plus text-base text-muted-foreground"></i>
            <div class="grid size-7 place-items-center rounded-full bg-gray-900"><i class="ph ph-arrow-up text-xs text-white"></i></div>
          </div>
        </div>`;

      const request = (inner, ring = "ring-gray-900/10") => `
        <div class="rounded-[20px] bg-white p-4 ring-1 ${ring} shadow-sm">${inner}</div>`;

      const requestHead = (icon, title, note) => `
        <div class="flex items-start gap-2.5">
          <i class="ph ${icon} mt-0.5 text-lg text-gray-700"></i>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium">${title}</p>
            ${note ? `<p class="mt-0.5 text-xs leading-4 text-muted-foreground">${note}</p>` : ""}
          </div>
        </div>`;

      const actions = (primary, secondary = "Not now") => `
        <div class="mt-3 flex items-center justify-end gap-2">
          <span class="rounded-md px-2.5 py-1 text-xs font-medium text-muted-foreground">${secondary}</span>
          <span class="rounded-md bg-gray-900 px-3 py-1 text-xs font-medium text-white">${primary}</span>
        </div>`;

      const field = (label, value) => `
        <div>
          <p class="mb-1 text-[11px] font-medium text-muted-foreground">${label}</p>
          <div class="flex h-8 items-center rounded-lg border border-input bg-background px-2.5">
            <span class="text-xs text-gray-400">${value}</span>
          </div>
        </div>`;

      const COL = { w: 560, h: 760 };
      const CARD = { w: 470, h: 300 };

      // ---- the sequence, then the kinds that share the surface -------------
      const states = [
        {
          ...COL,
          title: "Today, in the stream",
          note: "A blocked turn can sit off-screen with a live composer under it. Nothing says the agent is waiting, and nothing stops you asking something else.",
          titleClass: "text-error-700",
          body: column(
            `<div class="-mt-12 overflow-hidden rounded-2xl border border-border bg-white opacity-55">
               <div class="flex items-center gap-2 border-b border-border px-4 py-2.5">
                 <i class="ph ph-lock-key text-sm text-muted-foreground"></i>
                 <span class="text-xs font-medium">Connect Linear</span>
               </div>
               <div class="px-4 py-3"><div class="h-9 rounded-md border border-input bg-muted"></div></div>
             </div>
             <div class="flex items-center justify-center gap-2 rounded-md bg-error-50 px-3 py-1.5">
               <i class="ph ph-arrow-up text-xs text-error-700"></i>
               <span class="text-xs font-medium text-error-700">Scrolled past. Still waiting.</span>
             </div>
             <div class="space-y-2.5 pt-2">${bars("100%", "88%", "62%")}</div>
             ${bubble("Actually, can you check the Q3 numbers first?")}
             <div class="space-y-2.5">${bars("100%", "74%")}</div>`,
            `${liveComposer()}
             <p class="mt-2 text-center text-xs text-error-700">You can type right past the question</p>`,
          ),
        },
        {
          ...COL,
          title: "Docked at the composer",
          note: "The request takes the composer's place, so it is where the cursor already is. Declining is a first-class answer, not an abandoned turn.",
          titleClass: "text-foreground",
          body: column(
            `<div class="space-y-2.5">${bars("100%", "80%")}</div>
             ${bubble("Connect my Linear")}
             <div class="space-y-2.5">${bars("100%", "66%")}</div>`,
            request(`
              ${requestHead("ph-lock-key", "Linear needs an API key", "Stored encrypted on this Mac. The agent never sees it.")}
              <div class="mt-3 flex h-9 items-center rounded-lg border border-input bg-background px-3">
                <span class="font-mono text-sm tracking-widest text-gray-400">••••••••••••</span>
              </div>
              <div class="mt-3 flex items-center justify-between">
                <span class="text-xs text-muted-foreground underline decoration-gray-300 underline-offset-2">Where do I find this?</span>
                <div class="flex items-center gap-2">
                  <span class="rounded-md px-2.5 py-1 text-xs font-medium text-muted-foreground">Not now</span>
                  <span class="rounded-md bg-gray-900 px-3 py-1 text-xs font-medium text-white">Connect</span>
                </div>
              </div>`),
          ),
        },
        {
          ...COL,
          title: "A form, not a field",
          note: "One request gathers a whole form. Otherwise the agent spends a turn per field, and each turn is another chance to answer something else.",
          titleClass: "text-foreground",
          body: column(
            `<div class="space-y-2.5">${bars("100%", "72%")}</div>`,
            request(`
              ${requestHead("ph-sliders-horizontal", "Set up the Shopify connection", "Three things the agent could not work out on its own.")}
              <div class="mt-3 space-y-3">
                ${field("Store domain", "acme.myshopify.com")}
                ${field("API version", "2026-07")}
                <div class="flex items-center gap-2">
                  <span class="grid size-4 place-items-center rounded-[4px] bg-gray-900"><i class="ph ph-check text-[9px] text-white"></i></span>
                  <span class="text-xs">Include draft orders</span>
                </div>
              </div>
              ${actions("Continue", "Cancel")}`),
          ),
        },
        {
          ...COL,
          title: "Answered",
          note: "The composer comes back and the transcript keeps a one-line record. The stream stores what was decided without owning the interaction.",
          titleClass: "text-success-700",
          body: column(
            `<div class="space-y-2.5">${bars("100%", "78%")}</div>
             <div class="inline-flex items-center gap-2 rounded-lg border border-border bg-white px-3 py-1.5">
               <i class="ph-fill ph-check-circle text-base text-success-500"></i>
               <span class="text-xs text-muted-foreground">Connected Linear</span>
             </div>
             <div class="space-y-2.5">${bars("100%", "91%", "55%")}</div>`,
            `<div class="grid h-[70px] grid-rows-[1fr_auto] rounded-[20px] bg-white p-4 shadow-sm">
               <span class="text-sm text-gray-400">Reply to Instrument</span>
               <div class="flex items-center justify-between pt-1">
                 <i class="ph ph-plus text-base text-muted-foreground"></i>
                 <div class="grid size-7 place-items-center rounded-full bg-gray-300"><i class="ph ph-arrow-up text-xs text-white"></i></div>
               </div>
             </div>`,
          ),
        },
        {
          ...CARD,
          title: "Choice",
          note: "What Choose was always meant to be. An enum in the schema, buttons in the surface.",
          titleClass: "text-foreground",
          body: `<div class="h-full bg-gray-50 p-5">${request(`
            <p class="text-sm font-medium">Which Notion workspace?</p>
            <div class="mt-3 space-y-2">
              <div class="rounded-lg border border-input px-3 py-2 text-xs">Acme (personal)</div>
              <div class="rounded-lg border border-gray-900 bg-gray-50 px-3 py-2 text-xs font-medium">Acme Engineering</div>
              <div class="rounded-lg border border-input px-3 py-2 text-xs">Design Team</div>
            </div>`)}</div>`,
        },
        {
          ...CARD,
          h: 320,
          title: "Consent",
          note: "Spawning a local MCP server is arbitrary code execution. Same surface, raised weight, and the exact command shown rather than described.",
          titleClass: "text-warning-700",
          body: `<div class="h-full bg-gray-50 p-5">${request(`
            ${requestHead("ph-warning", "Run a server on your Mac?", "")}
            <p class="mt-2 rounded-md bg-muted p-2.5 font-mono text-[11px] leading-4 break-all">npx -y @modelcontextprotocol/server-filesystem</p>
            <p class="mt-2 text-xs leading-4 text-muted-foreground">This executes code outside Instrument's sandbox with access to your files.</p>
            ${actions("Run it", "No")}`, "ring-warning-500/40")}</div>`,
        },
        {
          ...CARD,
          title: "Form",
          note: "Flat objects of primitives and enums, which is exactly the schema subset MCP elicitation permits. No nesting to render.",
          titleClass: "text-foreground",
          body: `<div class="h-full bg-gray-50 p-5">${request(`
            <p class="text-sm font-medium">Two more details</p>
            <div class="mt-3 space-y-2.5">
              <div class="h-9 rounded-lg border border-input bg-background"></div>
              <div class="h-9 rounded-lg border border-input bg-background"></div>
            </div>
            ${actions("Continue", "Cancel")}`)}</div>`,
        },
        {
          ...CARD,
          title: "Secret",
          note: "Looks identical, is not. Elicitation forbids requesting secrets, so this shares the surface but bypasses the model round-trip entirely.",
          titleClass: "text-error-700",
          body: `<div class="h-full bg-error-50 p-5">${request(`
            ${requestHead("ph-lock-key", "API key", "Goes straight to the encrypted store. Never enters the transcript or the model's context.")}
            <div class="mt-3 flex h-9 items-center rounded-lg border border-input px-3">
              <span class="font-mono text-sm tracking-widest text-gray-400">••••••••</span>
            </div>`, "ring-error-300")}</div>`,
        },
      ];

      // ---- render ----------------------------------------------------------
      const rack = document.querySelector("#rack");

      rack.innerHTML = states
        .map(
          (state, i) => `
        <figure id="f${i}" class="tile m-0 flex flex-col overflow-hidden rounded-xl bg-white p-3 shadow-sm">
          <div class="frame self-center overflow-hidden rounded-lg ring-1 ring-black/5" data-w="${state.w || W}" data-h="${state.h || H}" style="--w:${state.w || W}px; --h:${state.h || H}px">
            <div>${state.body}</div>
          </div>
          <figcaption class="mt-3 flex-1 text-xs leading-5 text-muted-foreground">
            <span class="font-medium ${state.titleClass}">${state.title}.</span> ${state.note}
          </figcaption>
        </figure>`,
        )
        .join("");

      document.querySelector("#count").textContent = `${states.length} frames`;

      document.querySelector("#subtitle").textContent = SUBTITLE;

      // ---- density ---------------------------------------------------------
      // Fit as many tiles per row as the width allows, then derive the scale
      // from the tile. Frames never render above their true size.
      const TILE_MIN = 330;
      const GAP = 20;
      const PAD = 26; // card padding plus borders
      let single = false;

      const layout = () => {
        const avail = rack.clientWidth - 48;
        if (avail <= 0) return;
        const columns = single ? 1 : Math.max(1, Math.floor((avail + GAP) / (TILE_MIN + GAP)));
        const inner = (avail - GAP * (columns - 1)) / columns - PAD;
        rack.style.setProperty("--cols", columns);
        for (const frame of rack.querySelectorAll(".frame")) {
          frame.style.setProperty("--s", Math.max(0.05, Math.min(inner / Number(frame.dataset.w), 1)));
        }
      };

      new ResizeObserver(layout).observe(rack);
      layout();

      // ---- view mode -------------------------------------------------------
      const VIEWS = [
        ["grid", "ph-squares-four", "Grid"],
        ["single", "ph-rows", "One per row"],
      ];
      const viewBox = document.querySelector("#views");

      const paintViews = () => {
        viewBox.innerHTML = VIEWS.map(
          ([key, icon, title]) => `
          <button data-view="${key}" title="${title}" class="grid size-7 place-items-center rounded-md ${
            (key === "single") === single ? "bg-white text-foreground shadow-sm" : "text-muted-foreground"
          }"><i class="ph ${icon}"></i></button>`,
        ).join("");
      };
      paintViews();

      viewBox.addEventListener("click", (event) => {
        const button = event.target.closest("[data-view]");
        if (!button) return;
        single = button.dataset.view === "single";
        paintViews();
        layout();
      });

      // ---- enlarge ---------------------------------------------------------
      const viewer = document.querySelector("dialog.viewer");

      rack.addEventListener("click", (event) => {
        const frame = event.target.closest(".frame");
        if (!frame) return;
        const clone = frame.cloneNode(true);
        clone.style.setProperty(
          "--s",
          Math.min((innerWidth * 0.95) / Number(frame.dataset.w), (innerHeight * 0.95) / Number(frame.dataset.h)),
        );
        viewer.replaceChildren(clone);
        viewer.showModal();
      });

      viewer.addEventListener("click", (event) => {
        if (event.target === viewer) viewer.close();
      });

      // ---- tab identity ----------------------------------------------------
      const heading = document.querySelector("h1").textContent.trim();
      document.title = `v${VERSION} · ${heading}`;
      document.querySelector("#favicon").href =
        "data:image/svg+xml," +
        encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0e7869"/><text x="16" y="24" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#ffffff">${VERSION}</text></svg>`,
        );
    </script>
  </body>
</html>
