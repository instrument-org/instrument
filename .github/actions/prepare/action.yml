description: Prepares the repo for a typical CI job

inputs:
  token:
    description: GITHUB_TOKEN used for authenticated dependency downloads during install
    required: true

name: Prepare

runs:
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
    # pnpm-workspace.yaml included so allowBuilds/ignoredOptionalDependencies
    # changes bust the cache (setup-node only hashes pnpm-lock.yaml by default).
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          pnpm-workspace.yaml
        node-version: "24"
    - name: set-cache-dirs
      run: |
        mkdir -p "$HOME/.cache/dugite"
        echo "DUGITE_CACHE_DIR=$HOME/.cache/dugite" >> "$GITHUB_ENV"
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
        elif [ "$RUNNER_OS" = "macOS" ]; then
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
        fi
      shell: bash
    - env:
        GITHUB_TOKEN: ${{ inputs.token }}
      name: install-dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
    - env:
        GITHUB_TOKEN: ${{ inputs.token }}
      name: verify-electron-install
      run: |
        set -euo pipefail
        electron_dir="$(
          find node_modules/.pnpm -path '*/node_modules/electron' -maxdepth 6 -type d 2>/dev/null \
            | grep -E '/electron@[0-9]+\.' | head -1
        )"
        if [ -z "$electron_dir" ] || [ ! -f "$electron_dir/path.txt" ]; then
          echo "Electron install incomplete; clearing download cache and reinstalling"
          rm -rf "${XDG_CACHE_HOME:-$HOME/.cache}/electron" \
                 ~/Library/Caches/electron \
                 "${LOCALAPPDATA:-}/electron/Cache" \
                 "$electron_dir" 2>/dev/null || true
          pnpm install --frozen-lockfile
        fi
      shell: bash
    - uses: rharkor/caching-for-turbo@00a0515f175df9fd2e15c4560144ad5fdbebb0c7 # v2.3.13
  using: composite
