description: >-
  One long working chat, three hundred turns of tool work each ending in a
  reply with a table, code or file cards, for measuring a transcript read back
  a long way and checking that scrolling through it never jumps. Generated by
  generate.ts, not recorded.
settings:
  preferences:
    developerMode: true
chats:
  - key: harbor-survey
    name: Harbor survey
    agedMinutes: 5
    folders:
      - mount: Instrument
        files:
          - from: berths.csv
            to: harbor-survey/berths.csv
          - from: tides.md
            to: harbor-survey/tides.md
          - from: report.html
            to: harbor-survey/report.html
          - from: moorings.json
            to: harbor-survey/moorings.json
