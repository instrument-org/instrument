description: Prepares the repo for a typical CI job

inputs:
  token:
    description: Required for downloading @vscode/ripgrep
    required: true

name: Prepare

runs:
  steps:
    - uses: pnpm/action-setup@v4.4.0
    # pnpm-workspace.yaml included so allowBuilds/ignoredOptionalDependencies
    # changes bust the cache (setup-node only hashes pnpm-lock.yaml by default).
    - uses: actions/setup-node@v6.3.0
      with:
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          pnpm-workspace.yaml
        node-version: "24"
    - env:
        DUGITE_CACHE_DIR: $HOME/.cache/dugite
        GITHUB_TOKEN: ${{ inputs.token }}
      name: install-dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
