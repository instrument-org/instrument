description: Prepares the repo for a typical CI job

inputs:
  token:
    description: Required for downloading @vscode/ripgrep
    required: true

name: Prepare

runs:
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
    # pnpm-workspace.yaml included so allowBuilds/ignoredOptionalDependencies
    # changes bust the cache (setup-node only hashes pnpm-lock.yaml by default).
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          pnpm-workspace.yaml
        node-version: "24"
    - name: set-cache-dirs
      run: |
        mkdir -p "$HOME/.cache/dugite"
        echo "DUGITE_CACHE_DIR=$HOME/.cache/dugite" >> "$GITHUB_ENV"
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
        elif [ "$RUNNER_OS" = "macOS" ]; then
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
        fi
      shell: bash
    - env:
        GITHUB_TOKEN: ${{ inputs.token }}
      name: install-dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
    - env:
        ELECTRON_RUN_AS_NODE: "1"
      name: verify-electron-install
      run: |
        set -euo pipefail

        electron_dir="$(
          find node_modules/.pnpm -path '*/electron@*/node_modules/electron' -type d 2>/dev/null | head -1
        )"
        if [ -z "$electron_dir" ]; then
          echo "Could not find electron package under node_modules/.pnpm"
          exit 1
        fi

        electron_is_installed() {
          [ -f "$electron_dir/path.txt" ] && [ -d "$electron_dir/dist" ]
        }

        if ! electron_is_installed; then
          echo "Electron install incomplete; running install.js"
          node "$electron_dir/install.js"
        fi

        if ! electron_is_installed; then
          echo "Electron still incomplete; clearing download cache and retrying install.js"
          rm -rf "${XDG_CACHE_HOME:-$HOME/.cache}/electron"
          node "$electron_dir/install.js"
        fi

        if ! electron_is_installed; then
          echo "Electron failed to install after retry (expected path.txt and dist/)"
          exit 1
        fi

        pnpm --filter @instrument-org/studio exec electron -v
      shell: bash
    - uses: rharkor/caching-for-turbo@00a0515f175df9fd2e15c4560144ad5fdbebb0c7 # v2.3.13
  using: composite
