blank_issues_enabled: false
contact_links:
  - about: Something is broken or behaving unexpectedly. Start here for every bug, and fill the template in completely.
    name: Report a Bug
    url: https://github.com/instrument-org/instrument/discussions/new?category=issue-triage
  - about: Ask for something Instrument does not do yet, or float a direction you are still turning over.
    name: Request a Feature or Share an Idea
    url: https://github.com/instrument-org/instrument/discussions/new?category=feature-requests-ideas
  - about: Ask how to do something, or get help with setup, providers, and API keys. Not for bug reports.
    name: Ask a Question
    url: https://github.com/instrument-org/instrument/discussions/new?category=q-a
  - about: Please disclose privately by email rather than filing in public.
    name: Report a Security Vulnerability
    url: https://github.com/instrument-org/instrument/security/policy
