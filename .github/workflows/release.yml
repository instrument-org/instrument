name: Release

on:
  workflow_dispatch:
    inputs: {}
  push:
    tags:
      - v*.*.*

jobs:
  smoke_test:
    name: Smoke Test
    uses: ./.github/workflows/smoke-test.yml
    secrets: inherit

  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: "write"

    env:
      # electron-builder doesn't support custom update channels for Intel Mac, so skip
      # prerelease builds to avoid broken auto-update metadata for Intel Mac users.
      SKIP_INTEL_MACOS: ${{ matrix.skip_for_prerelease && github.ref_type == 'tag' && (contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            runner: ubuntu-latest
          - os: ubuntu-latest
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows-latest
            arch: x64
            runner: windows-latest
          - os: macos
            arch: x64
            runner: macos-26-intel
            skip_for_prerelease: true
          - os: macos
            arch: arm64
            runner: macos-26

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-binary-caches
      - uses: ./.github/actions/prepare
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - if: matrix.os == 'ubuntu-latest'
        name: Build Linux (vite)
        run: pnpm turbo run build:vite --filter=@instrument-org/studio
        env:
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ vars.MAIN_VITE_GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}
          MAIN_VITE_APP_API_BASE_URL: ${{ vars.MAIN_VITE_APP_API_BASE_URL }}
          VITE_POSTHOG_API_HOST: ${{ vars.VITE_POSTHOG_API_HOST }}
          VITE_POSTHOG_API_KEY: ${{ vars.VITE_POSTHOG_API_KEY }}

      - if: matrix.os == 'ubuntu-latest'
        name: Upload source maps to PostHog
        uses: ./.github/actions/posthog-sourcemap-upload
        with:
          api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          project-id: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          version: ${{ github.ref_name }}

      - if: matrix.os == 'ubuntu-latest'
        name: Package Linux
        run: pnpm --filter @instrument-org/studio exec electron-builder --linux --${{ matrix.arch }} --publish never

      - if: matrix.os == 'macos' && env.SKIP_INTEL_MACOS != 'true'
        name: setup-signing
        run: |
          mkdir -p ~/.private_keys
          echo '${{ secrets.APPLE_API_KEY_DATA }}' > ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - if: matrix.os == 'macos' && env.SKIP_INTEL_MACOS != 'true'
        name: Build Mac (vite)
        run: pnpm turbo run build:vite --filter=@instrument-org/studio
        env:
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ vars.MAIN_VITE_GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}
          MAIN_VITE_APP_API_BASE_URL: ${{ vars.MAIN_VITE_APP_API_BASE_URL }}
          VITE_POSTHOG_API_HOST: ${{ vars.VITE_POSTHOG_API_HOST }}
          VITE_POSTHOG_API_KEY: ${{ vars.VITE_POSTHOG_API_KEY }}

      - if: matrix.os == 'macos' && env.SKIP_INTEL_MACOS != 'true'
        name: Upload source maps to PostHog
        uses: ./.github/actions/posthog-sourcemap-upload
        with:
          api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          project-id: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          version: ${{ github.ref_name }}

      - if: matrix.os == 'macos' && env.SKIP_INTEL_MACOS != 'true'
        name: Package Mac
        run: pnpm --filter @instrument-org/studio exec electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY: ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_NOTARIZATION_ENABLED: ${{ vars.APPLE_NOTARIZATION_ENABLED }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          ARCH: ${{ matrix.arch }}

      - if: matrix.os == 'macos' && env.SKIP_INTEL_MACOS != 'true'
        name: Cleanup Signing
        run: |
          rm ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - if: matrix.os == 'windows-latest'
        uses: KamaranL/add-signtool-action@d0027a4cf430f8dfdb15fba53410d0c76b7566f4 # v1
        id: signtool

      - if: matrix.os == 'windows-latest'
        id: auth-google-cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - if: matrix.os == 'windows-latest'
        name: Install GCP KMS CNG Provider
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'cng-v1.2'
          $zipUrl  = "https://github.com/GoogleCloudPlatform/kms-integrations/releases/download/$version/kmscng-1.2-windows-amd64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "kmscng-$version.zip"
          $outDir  = Join-Path $env:RUNNER_TEMP "kmscng-$version"

          Invoke-WebRequest $zipUrl -OutFile $zipPath
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $outDir -Force

          $msi = Get-ChildItem -Path $outDir -Recurse -Filter "kmscng.msi" | Select-Object -First 1
          if (-not $msi) { throw "kmscng.msi not found in archive." }

          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$($msi.FullName)`" /qn"

          # quick sanity check: CNG provider is registered
          certutil -csp "Google Cloud KMS Provider" -csptest

      - if: matrix.os == 'windows-latest'
        name: Write EV Cert Chain File
        shell: pwsh
        run: |
          Set-Content -Path "${{ env.WIN_CERT_PATH }}" -Value '${{ env.WIN_EV_CERT_PEM }}' -Encoding ascii
        env:
          WIN_CERT_PATH: ${{ runner.temp }}\ev-chain.pem
          WIN_EV_CERT_PEM: ${{ secrets.WIN_EV_CERT_PEM }}

      - if: matrix.os == 'windows-latest'
        name: Build Windows (vite)
        run: pnpm turbo run build:vite --filter=@instrument-org/studio
        env:
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ vars.MAIN_VITE_GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}
          MAIN_VITE_APP_API_BASE_URL: ${{ vars.MAIN_VITE_APP_API_BASE_URL }}
          VITE_POSTHOG_API_HOST: ${{ vars.VITE_POSTHOG_API_HOST }}
          VITE_POSTHOG_API_KEY: ${{ vars.VITE_POSTHOG_API_KEY }}

      - if: matrix.os == 'windows-latest'
        name: Upload source maps to PostHog
        uses: ./.github/actions/posthog-sourcemap-upload
        with:
          api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          project-id: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          version: ${{ github.ref_name }}

      - if: matrix.os == 'windows-latest'
        name: Package Windows
        run: pnpm --filter @instrument-org/studio exec electron-builder --win --${{ matrix.arch }} --publish never
        env:
          WIN_GCP_KMS_KEY_VERSION: ${{ secrets.WIN_GCP_KMS_KEY_VERSION }}
          WIN_CERT_PATH: ${{ runner.temp }}\ev-chain.pem

      - if: matrix.os == 'windows-latest'
        name: Verify Signatures
        shell: pwsh
        run: |
          & "${{ env.SIGNTOOL_PATH }}" verify /pa /all "apps\studio\dist\*.exe"
        env:
          SIGNTOOL_PATH: signtool.exe

      # builder-debug.yml is excluded because it is generated by electron-builder on every
      # platform. Concurrent uploads of the same filename to the GitHub release cause the
      # API to return 404 on asset updates (race condition in softprops/action-gh-release).
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.SKIP_INTEL_MACOS != 'true'
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            apps/studio/dist/*.exe
            apps/studio/dist/*.zip
            apps/studio/dist/*.dmg
            apps/studio/dist/*.AppImage
            apps/studio/dist/*.deb
            apps/studio/dist/*.rpm
            apps/studio/dist/*.tar.gz
            apps/studio/dist/*.yml
            apps/studio/dist/*.blockmap
            apps/studio/dist/*.snap
            !apps/studio/dist/builder-debug.yml
          retention-days: 30
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, smoke_test]
    if: |
      github.ref_type == 'tag' &&
      needs.build.result == 'success' &&
      needs.smoke_test.result == 'success'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload release artifacts to S3
        run: |
          aws s3 sync artifacts/ s3://instrument-releases/ \
            --endpoint-url "${{ vars.BUILDER_PUBLISH_S3_ENDPOINT }}" \
            --no-progress \
            --exclude "*.png"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Build Slack commit summary
        id: slack_summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_IS_PRERELEASE="${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}"
          if [ "$CURRENT_IS_PRERELEASE" = "true" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" || true)
          else
            PREV_TAG=$(
              gh api \
                "repos/${{ github.repository }}/releases?per_page=100" \
                --jq '.[] | select(.tag_name != "${{ github.ref_name }}" and .prerelease == false and .draft == false) | .tag_name' \
                | head -n1 || true
            )
          fi
          if [ -z "$PREV_TAG" ]; then
            if [ "$CURRENT_IS_PRERELEASE" = "true" ]; then
              PREV_TAG=$(
                git tag --sort=-version:refname \
                  | grep -v "^${{ github.ref_name }}$" \
                  | head -n1 || true
              )
            else
              PREV_TAG=$(
                git tag --sort=-version:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                  | grep -v "^${{ github.ref_name }}$" \
                  | head -n1 || true
              )
            fi
          fi
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          RANGE="${PREV_TAG:+$PREV_TAG..}${{ github.ref_name }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          REGISTRY_REPO_URL="https://github.com/instrument-org/skills"
          APP_COMMITS=$(
            git log "$RANGE" \
              --pretty=format:"%h %s" \
              --no-merges \
              --extended-regexp \
              --invert-grep \
              --grep='^release\([^)]*\):' \
              --grep='^feat\(registry\): update to latest$'
          )
          REGISTRY_COMMITS=""
          REGISTRY_PREV=""
          REGISTRY_CURRENT=$(git rev-parse "${{ github.ref_name }}:registry" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            REGISTRY_PREV=$(git rev-parse "${PREV_TAG}:registry" 2>/dev/null || true)
          fi
          if [ -n "$REGISTRY_PREV" ] && [ -n "$REGISTRY_CURRENT" ] && [ "$REGISTRY_PREV" != "$REGISTRY_CURRENT" ]; then
            REGISTRY_COMMITS=$(
              git -C registry log "$REGISTRY_PREV..$REGISTRY_CURRENT" \
                --pretty=format:"%h %s" \
                --no-merges
            )
          fi
          # shellcheck disable=SC2001  # per-line regex strip; ${//} can't do this
          SUMMARY=$(
            {
              echo "$APP_COMMITS" | sed 's/^[^ ]* /• /'
              echo "$REGISTRY_COMMITS" | sed 's/^[^ ]* /• [skills] /'
            } | sed '/^$/d'
          )
          COUNT=$(printf '%s\n' "$SUMMARY" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            SLACK="_No user-facing changes in this release._"
          else
            SLACK=$(echo "$SUMMARY" | head -n10)
          fi
          if [ "$COUNT" -gt 10 ]; then
            SLACK="$SLACK
          _…and $((COUNT - 10)) more commits_"
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          # Escape for JSON: backslash, double-quote, then newlines → \n
          SLACK_JSON=$(printf '%s' "$SLACK" | sed 's/\\/\\\\/g; s/"/\\"/g' | awk '{printf "%s\\n", $0}' | sed 's/\\n$//')
          echo "slack_log_json=$SLACK_JSON" >> "$GITHUB_OUTPUT"
          printf '## What'\''s changed\n' > /tmp/release-body.md
          if [ "$COUNT" -eq 0 ]; then
            printf '\n_No user-facing changes in this release._\n' >> /tmp/release-body.md
          else
            if [ -n "$APP_COMMITS" ]; then
              printf '\n### Instrument\n\n' >> /tmp/release-body.md
              echo "$APP_COMMITS" | awk -v repo="$REPO_URL" '{hash=$1; $1=""; sub(/^ /,""); printf "• [`%s`](%s/commit/%s) %s\n", hash, repo, hash, $0}' >> /tmp/release-body.md
            fi
            if [ -n "$REGISTRY_COMMITS" ]; then
              printf '\n### Skills\n\n' >> /tmp/release-body.md
              echo "$REGISTRY_COMMITS" | awk -v repo="$REGISTRY_REPO_URL" '{hash=$1; $1=""; sub(/^ /,""); printf "• [`%s`](%s/commit/%s) %s\n", hash, repo, hash, $0}' >> /tmp/release-body.md
            fi
          fi
          if [ -n "$PREV_TAG" ]; then
            printf '\n**Full Changelog**: %s/compare/%s...%s\n' "$REPO_URL" "$PREV_TAG" "${{ github.ref_name }}" >> /tmp/release-body.md
          fi
          if [ -n "$REGISTRY_PREV" ] && [ -n "$REGISTRY_CURRENT" ] && [ "$REGISTRY_PREV" != "$REGISTRY_CURRENT" ]; then
            printf '\n**Skills Changelog**: %s/compare/%s...%s\n' "$REGISTRY_REPO_URL" "$REGISTRY_PREV" "$REGISTRY_CURRENT" >> /tmp/release-body.md
          fi

      - name: Remove smoke test screenshots from artifacts
        run: find artifacts -name "*.png" -delete

      - name: GitHub Prerelease
        id: prerelease_release
        if: contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          draft: true
          prerelease: true
          generate_release_notes: false
          body_path: /tmp/release-body.md

      - name: GitHub Stable Release
        id: stable_release
        if: ${{ !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          draft: true
          prerelease: false
          generate_release_notes: false
          body_path: /tmp/release-body.md

      - name: Capture release URL
        id: release
        run: echo "url=${{ steps.prerelease_release.outputs.url || steps.stable_release.outputs.url }}" >> "$GITHUB_OUTPUT"

      - name: Delete workflow artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: "*"
          failOnError: false

      - name: Notify Slack
        if: contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          webhook: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Instrument ${{ contains(github.ref_name, '-alpha') && 'alpha' || 'beta' }} *${{ github.ref_name }}* is now available. <${{ steps.release.outputs.url }}|View release notes>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.slack_summary.outputs.slack_log_json }}"
                  }
                }
              ]
            }

      - name: Notify Slack with release notes nudge
        if: ${{ !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') }}
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          webhook: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Instrument *${{ github.ref_name }}* is now available."
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.slack_summary.outputs.slack_log_json }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ vars.SLACK_RELEASE_NOTES_MENTION || '<!channel>' }}: review and publish the draft GitHub release notes for this version. <${{ steps.release.outputs.url }}|Open the draft>"
                  }
                }
              ]
            }
