<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title and the version digit on the favicon are set from VERSION at the
         end of the body. Leave both placeholders alone. -->
    <title>Wireframe</title>
    <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg/%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
      rel="stylesheet"
      type="text/css"
    />
    <style type="text/tailwindcss">
      @import "tailwindcss";

      /* Studio's light theme, resolved from
         apps/studio/src/client/styles/globals.css. Regenerate with the command
         in SKILL.md rather than editing by hand. */
      @theme {
        /* sync:start */
        --font-sans: "Work Sans", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono Variable", "JetBrains Mono", ui-monospace, monospace;

        --radius: 0.5rem;
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);

        --shadow-sm: 0 2px 4px 0 rgb(10 13 18 / 0.04), 0 1px 2px -1px rgb(10 13 18 / 0.06), 0 0 0 1px rgb(10 13 18 / 0.06);
        --shadow-xl: 0 12px 24px -4px rgb(10 13 18 / 0.07), 0 6px 10px -6px rgb(10 13 18 / 0.07), 0 0 0 1px rgb(10 13 18 / 0.06);

        --color-gray-25: #fdfdfc;
        --color-gray-50: #fafaf9;
        --color-gray-100: #f5f5f4;
        --color-gray-200: #e7e5e4;
        --color-gray-300: #d7d3d0;
        --color-gray-400: #a9a29d;
        --color-gray-500: #79716b;
        --color-gray-600: #57534e;
        --color-gray-700: #44403c;
        --color-gray-800: #292524;
        --color-gray-900: #1c1917;
        --color-gray-950: #171412;

        --color-brand-25: #f1f4f2;
        --color-brand-50: #e2eae7;
        --color-brand-100: #c5d5d0;
        --color-brand-200: #9dbfb6;
        --color-brand-300: #6ca89c;
        --color-brand-400: #338c81;
        --color-brand-500: #0e7869;
        --color-brand-600: #0b6056;
        --color-brand-700: #0a4a42;
        --color-brand-800: #093a34;
        --color-brand-900: #082c28;
        --color-brand-950: #051b18;

        --color-error-50: #fbeef0;
        --color-error-100: #f8e4e8;
        --color-error-300: #e197a6;
        --color-error-500: #b4324f;
        --color-error-700: #7a1f30;
        --color-error-900: #3f121a;

        --color-warning-50: #fffaeb;
        --color-warning-100: #fef0c7;
        --color-warning-300: #fec84b;
        --color-warning-500: #f79009;
        --color-warning-700: #b54708;
        --color-warning-900: #7a2e0e;

        --color-success-50: #e9f5eb;
        --color-success-100: #d9f1db;
        --color-success-300: #7dcb87;
        --color-success-500: #29a845;
        --color-success-700: #176229;
        --color-success-900: #0b3216;

        --color-yellow-50: #fdf6e2;
        --color-yellow-100: #fbebc9;
        --color-yellow-300: #f1cc8e;
        --color-yellow-500: #d58f4f;
        --color-yellow-700: #b26747;
        --color-yellow-900: #59301e;

        --color-brown-50: #fcfbf8;
        --color-brown-100: #f6f4f0;
        --color-brown-300: #e8e3da;
        --color-brown-500: #bbaa8e;
        --color-brown-700: #937b5b;
        --color-brown-900: #564538;

        --color-background: #fafaf9;
        --color-foreground: #171412;
        --color-card: #ffffff;
        --color-popover: #ffffff;
        --color-primary: #171412;
        --color-primary-foreground: #ffffff;
        --color-secondary: #f5f5f4;
        --color-secondary-foreground: #292524;
        --color-muted: #f5f5f4;
        --color-muted-foreground: #79716b;
        --color-accent: #e7e5e4;
        --color-accent-foreground: #292524;
        --color-destructive: #b4324f;
        --color-border: #e7e5e4;
        --color-input: #e7e5e4;
        --color-ring: #a9a29d;
        /* sync:end */
      }
    </style>

    <style>
      /* A frame is drawn once at true size and shown at whatever scale fits.
         transform, not zoom: zoom re-runs layout at the smaller size, so text
         re-wraps and the miniature stops matching the thing it depicts. */
      .frame {
        width: calc(var(--w) * var(--s));
        height: calc(var(--h) * var(--s));
        overflow: hidden;
        cursor: zoom-in;
      }
      .frame > * {
        width: var(--w);
        height: var(--h);
        transform: scale(var(--s));
        transform-origin: top left;
      }

      /* Every tile reserves the same vertical space for its frame, whatever
         the frame's own aspect ratio, so captions start on the same line
         down the whole grid rather than only within a row. A frame shorter
         than the slot is centered in it, not stretched. */
      .slot {
        height: var(--slot-h);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* A real grid, not wrapped flex: cards in a row share a height, so
         captions line up and no tile bleeds into its neighbor. */
      body {
        overflow-anchor: none;
      }
      #rack {
        display: grid;
        grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
        gap: 1.25rem;
      }

      /* One small floating bar carries what you need to know and the only
         control worth having. Everything else is canvas. */

      /* The enlarged view is a column: caption and controls take their space
         first and the frame is scaled into what is left. That ordering is the
         whole point: a caption is never the thing that falls off the bottom,
         at any window height. dvh so mobile browser chrome does not eat it. */
      dialog.viewer {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        max-width: none;
        max-height: none;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        overscroll-behavior: contain;
      }
      dialog.viewer[open] {
        display: flex;
        flex-direction: column;
      }
      dialog.viewer::backdrop {
        background: rgb(23 20 18 / 0.85);
      }
      /* The enlarged frame stays interactive: the space around it dismisses. */
      dialog.viewer .frame {
        cursor: default;
      }
      /* Actual-size mode pans here. `flex:none` or the frame shrinks to the
         stage instead of overflowing it, and there is nothing to pan. Centering
         an overflowing child is `margin:auto` inside a flex parent, not
         `justify-content`, which puts the top and left edges out of reach. */
      #stage > * {
        flex: none;
        margin: auto;
      }

      /* Viewer controls: 44px targets in a row along the bottom, where a thumb
         reaches, rather than tucked into a corner. Machinery, not a class
         library for frames to use. */
      .vbtn {
        display: grid;
        place-items: center;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 9999px;
        background: rgb(255 255 255 / 0.1);
        color: #fff;
        font-size: 1.125rem;
      }
      .vbtn:hover {
        background: rgb(255 255 255 / 0.2);
      }
      .vbtn:active {
        background: rgb(255 255 255 / 0.35);
      }
      .vbtn:disabled {
        opacity: 0.25;
      }
      @media print {
        * {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-gray-100 font-sans text-sm text-foreground antialiased">
    <div
      id="hud"
      class="fixed top-4 left-4 z-20 flex max-w-[min(38rem,calc(100vw-2rem))] items-center gap-3 rounded-xl border border-border bg-white/95 px-3 py-2 shadow-sm backdrop-blur"
    >
      <div class="min-w-0">
        <h1 class="truncate text-[13px] leading-tight font-semibold">TITLE</h1>
        <p id="subtitle" class="truncate text-[11px] leading-tight text-muted-foreground"></p>
      </div>
      <span id="count" class="shrink-0 border-l border-border pl-3 text-[11px] whitespace-nowrap text-muted-foreground"></span>
      <div id="views" class="flex shrink-0 items-center gap-0.5 rounded-lg bg-gray-200/70 p-0.5"></div>
    </div>

    <main>
      <div id="rack" class="px-4 pt-19 pb-6 sm:px-6"></div>
    </main>

    <dialog class="viewer">
      <div id="stage" class="flex min-h-0 flex-1 p-4"></div>
      <div class="shrink-0 px-4 pb-[max(1rem,env(safe-area-inset-bottom))]">
        <p
          id="viewer-caption"
          class="mx-auto max-h-[30vh] max-w-3xl overflow-y-auto text-center text-sm leading-5 text-white"
        ></p>
        <div id="viewer-controls" class="mx-auto mt-3 grid max-w-3xl grid-cols-3 items-center">
          <button id="viewer-fit" class="vbtn justify-self-start"></button>
          <div class="flex items-center gap-2 justify-self-center">
            <button data-step="-1" title="Previous frame" class="vbtn"><i class="ph ph-caret-left"></i></button>
            <span id="viewer-counter" class="min-w-12 text-center font-mono text-xs text-white/70"></span>
            <button data-step="1" title="Next frame" class="vbtn"><i class="ph ph-caret-right"></i></button>
          </div>
          <button id="viewer-close" title="Close" class="vbtn justify-self-end"><i class="ph ph-x"></i></button>
        </div>
      </div>
    </dialog>

    <script>
      const VERSION = "1";
      const SUBTITLE = "Topic · what this covers";
      const W = 1280;
      const H = 800;
      // Fixed vertical space every tile's frame is centered within, so
      // captions align across the grid even when frames mix aspect ratios.
      // Keep this close to what most frames in the file actually measure —
      // too tall and short frames float in a lot of dead padding.
      const SLOT_H = 200;

      // ---- Studio kit ------------------------------------------------------
      // Pieces of the real app, so a frame is the thing you are proposing rather
      // than a window you rebuilt. Call what you need and delete the rest; a
      // frame should draw no chrome the proposal is not about.
      //
      // Write class names out whole. Building them by interpolation
      // (`bg-${tone}-500`) hides them from Tailwind's scanner and they silently
      // produce no styles: pass `"bg-warning-500"` instead of `"warning"`.

      /** Placeholder prose. Widths are CSS lengths: bars("100%", "72%"). */
      const bars = (...widths) =>
        widths.map((w) => `<div class="h-2.5 rounded-full bg-gray-300" style="width:${w}"></div>`).join("");

      /** The whole window: sidebar, conversation, and an optional artifact panel. */
      const appWindow = (sidebar, main, panel = "") => `
        <div class="flex h-full bg-gray-50">
          <aside class="w-64 shrink-0 border-r border-border bg-gray-100/70 p-4">
            <div class="mb-4 h-9 rounded-lg bg-gray-200/70"></div>
            ${sidebar}
          </aside>
          <section class="relative min-w-0 flex-1 p-8">${main}</section>
          ${panel ? `<aside class="w-[420px] shrink-0 border-l border-border bg-white">${panel}</aside>` : ""}
        </div>`;

      /** A task row in the sidebar. */
      const navItem = (label, { active = false, dot = "" } = {}) => `
        <div class="flex items-center gap-2 rounded-md px-3 py-2 ${active ? "bg-gray-200" : ""}">
          ${dot ? `<span class="size-2 shrink-0 rounded-full ${dot}"></span>` : ""}
          <span class="text-[15px] ${active ? "font-medium" : "text-muted-foreground"}">${label}</span>
        </div>`;

      /** A group heading above a run of nav items. */
      const navGroup = (text, toneClass = "text-muted-foreground") =>
        `<p class="px-3 pt-4 pb-1 text-xs font-medium tracking-wide ${toneClass} uppercase">${text}</p>`;

      /** The conversation column, centered the way the app centers it. */
      const conversation = (inner) => `<div class="mx-auto max-w-2xl">${inner}</div>`;

      /** Anchors its contents where the composer sits. Put the composer, or
       *  whatever replaces it, in here. */
      const dock = (inner) => `
        <div class="absolute inset-x-8 bottom-8"><div class="mx-auto max-w-2xl">${inner}</div></div>`;

      /** The composer at rest. `busy` swaps the send button for stop. */
      const composerBox = ({ placeholder = "", busy = false } = {}) => `
        <div class="grid h-20 grid-rows-[1fr_auto] rounded-[20px] bg-white p-4 shadow-sm">
          ${placeholder ? `<span class="text-sm text-gray-400">${placeholder}</span>` : `<div class="h-2.5 w-32 rounded-full bg-gray-300"></div>`}
          <div class="flex items-center justify-between pt-2">
            <i class="ph ph-plus text-lg text-muted-foreground"></i>
            <div class="grid size-8 place-items-center rounded-full ${busy ? "bg-gray-900" : "bg-gray-300"}">
              <i class="ph ${busy ? "ph-stop" : "ph-arrow-up"} text-sm text-white"></i>
            </div>
          </div>
        </div>`;

      /** A user message. The one small corner against three large ones is the
       *  most recognizable detail in the transcript, so keep it. */
      const bubble = (text) => `
        <div class="flex justify-end">
          <div class="inline-block max-w-[80%] rounded-tl-xl rounded-tr-sm rounded-br-xl rounded-bl-xl bg-linear-to-b from-card to-gray-25 px-4 py-2.5 shadow-sm">
            <span class="text-sm">${text}</span>
          </div>
        </div>`;

      /** A tool call, as the transcript shows one. */
      const toolRow = (icon, text) => `
        <div class="mt-2.5 flex items-center gap-2.5 rounded-lg border border-border bg-white px-3.5 py-2">
          <i class="ph ${icon} text-base text-muted-foreground"></i>
          <span class="text-sm text-muted-foreground">${text}</span>
        </div>`;

      /** One piece of UI on its own, for frames that are not a whole window.
       *  Set a smaller w and h on those states. */
      const surface = (inner) => `
        <div class="h-full bg-gray-50 p-5">
          <div class="h-full rounded-xl border border-border bg-white p-5 shadow-sm">${inner}</div>
        </div>`;

      // ---- the frames ------------------------------------------------------
      // Draw each frame at the size the thing really is. A whole Studio window
      // is 1280x800; a panel or a menu is whatever it actually measures. The
      // page works out how many fit per row and scales them to match, so never
      // shrink the drawing by hand.
      //
      // w and h fall back to W and H above. Set them per state when one file
      // mixes shapes.
      const states = [
        {
          title: "State name",
          note: "What this frame proves, not what it shows.",
          titleClass: "text-foreground",
          body: appWindow(
            navItem("A task", { active: true }) + navItem("Another task"),
            conversation(`
              ${bubble("What the person asked for")}
              <div class="mt-5 space-y-2.5">${bars("100%", "78%", "62%")}</div>
              ${toolRow("ph-file-plus", "Something the agent did")}
            `) + dock(composerBox({ busy: true })),
          ),
        },
      ];

      // ---- render ----------------------------------------------------------
      const rack = document.querySelector("#rack");

      rack.innerHTML = states
        .map(
          (state, i) => `
        <figure class="tile m-0 flex flex-col overflow-hidden rounded-xl bg-white p-3 shadow-sm">
          <div class="slot" style="--slot-h:${SLOT_H}px">
            <div class="frame overflow-hidden rounded-lg ring-1 ring-black/5" data-label="${i + 1} · ${state.title}" data-w="${state.w || W}" data-h="${state.h || H}" style="--w:${state.w || W}px; --h:${state.h || H}px">
              <div>${state.body}</div>
            </div>
          </div>
          <figcaption class="mt-3 text-xs leading-5 text-muted-foreground">
            <span class="mr-1.5 rounded bg-gray-100 px-1.5 py-0.5 font-mono text-[10px] text-gray-600">${i + 1}</span><span class="font-medium ${state.titleClass}">${state.title}.</span> ${state.note}
          </figcaption>
        </figure>`,
        )
        .join("");

      document.querySelector("#count").textContent = `${states.length} frames`;

      document.querySelector("#subtitle").textContent = SUBTITLE;

      // ---- density ---------------------------------------------------------
      // Fit as many tiles per row as the width allows, then derive the scale
      // from the tile. Frames never render above their true size.
      const TILE_MIN = 330;
      const GAP = 20;
      const PAD = 26; // card padding plus borders
      let single = false;

      const layout = () => {
        const pad = getComputedStyle(rack);
        const avail = rack.clientWidth - parseFloat(pad.paddingLeft) - parseFloat(pad.paddingRight);
        if (avail <= 0) return;
        const natural = Math.max(1, Math.floor((avail + GAP) / (TILE_MIN + GAP)));
        // Below two columns the two view modes draw the same thing, so the
        // toggle is a small dead target. On a phone it is always this way.
        document.querySelector("#views").hidden = natural < 2;
        const columns = single ? 1 : natural;
        const inner = (avail - GAP * (columns - 1)) / columns - PAD;
        rack.style.setProperty("--cols", columns);
        for (const frame of rack.querySelectorAll(".frame")) {
          const s = Math.min(inner / Number(frame.dataset.w), SLOT_H / Number(frame.dataset.h), 1);
          frame.style.setProperty("--s", Math.max(0.05, s));
        }
      };

      new ResizeObserver(layout).observe(rack);
      layout();

      // ---- view mode -------------------------------------------------------
      const VIEWS = [
        ["grid", "ph-squares-four", "Grid"],
        ["single", "ph-rows", "One per row"],
      ];
      const viewBox = document.querySelector("#views");

      const paintViews = () => {
        viewBox.innerHTML = VIEWS.map(
          ([key, icon, title]) => `
          <button data-view="${key}" title="${title}" class="grid size-7 place-items-center rounded-md ${
            (key === "single") === single ? "bg-white text-foreground shadow-sm" : "text-muted-foreground"
          }"><i class="ph ${icon}"></i></button>`,
        ).join("");
      };
      paintViews();

      viewBox.addEventListener("click", (event) => {
        const button = event.target.closest("[data-view]");
        if (!button) return;
        single = button.dataset.view === "single";
        paintViews();
        layout();
      });

      // ---- enlarge ---------------------------------------------------------
      // Stage, then caption, then controls, in a flex column. The frame is
      // scaled into whatever the stage measures *after* the caption has taken
      // its space, so a long caption shrinks the drawing rather than sliding
      // off the bottom of the screen.
      //
      // Everything here is reachable by tap as well as by key: prev/next
      // buttons, a horizontal swipe, an explicit close, and a fit/actual-size
      // toggle, because a 1280px frame fitted to a phone is unreadable and
      // there is no hover or Escape key to fall back on.
      const viewer = document.querySelector("dialog.viewer");
      const stage = document.querySelector("#stage");
      const viewerCaption = document.querySelector("#viewer-caption");
      const viewerCounter = document.querySelector("#viewer-counter");
      const fitButton = document.querySelector("#viewer-fit");
      let openIndex = -1;
      let fit = true;

      /** Fits the enlarged frame to the stage, or pins it to true size and lets
       *  the stage pan. */
      const fitFrame = () => {
        const frame = stage.firstElementChild;
        if (!frame) return;
        // Fitted, nothing overflows, so the stage does not scroll and a
        // horizontal drag is unambiguously a swipe. At true size it pans, and
        // the drag belongs to the browser. Pinch stays available in both.
        stage.style.overflow = fit ? "hidden" : "auto";
        stage.style.touchAction = fit ? "pan-y pinch-zoom" : "pan-x pan-y pinch-zoom";
        if (!fit) return frame.style.setProperty("--s", 1);
        const s = Math.min(
          (stage.clientWidth - 32) / Number(frame.dataset.w),
          (stage.clientHeight - 32) / Number(frame.dataset.h),
        );
        frame.style.setProperty("--s", Math.max(0.05, s));
      };

      /** Lands in the middle of the drawing rather than its top-left corner,
       *  which on a window-sized frame is an empty stretch of sidebar. Fitted,
       *  nothing overflows and this is a no-op. */
      const recenter = () =>
        stage.scrollTo((stage.scrollWidth - stage.clientWidth) / 2, (stage.scrollHeight - stage.clientHeight) / 2);

      const paintFit = () => {
        fitButton.innerHTML = `<i class="ph ${fit ? "ph-arrows-out" : "ph-arrows-in"}"></i>`;
        fitButton.title = fit ? "Actual size" : "Fit to screen";
      };

      /** Enlarges the frame at `index`, caption below it. Also how ←/→, the
       *  prev/next buttons and a swipe move to the next one, so the dialog
       *  never has to close and reopen to browse the set. */
      const showFrame = (index) => {
        const state = states[index];
        const tile = rack.querySelectorAll(".frame")[index];
        if (!tile) return;
        openIndex = index;
        stage.replaceChildren(tile.cloneNode(true));
        viewerCaption.innerHTML = `<span class="mr-1.5 rounded bg-white/15 px-1.5 py-0.5 font-mono text-[10px] text-white/80">${index + 1}</span><span class="font-medium">${state.title}.</span> <span class="text-white/80">${state.note}</span>`;
        viewerCounter.textContent = `${index + 1} / ${states.length}`;
        if (!viewer.open) {
          // Every open starts fitted, whatever the last one was left at. Done
          // here rather than on the dialog's close event, which does not fire
          // everywhere these files have to render.
          fit = true;
          paintFit();
          viewer.showModal();
        }
        // The dialog is open and laid out by now, so the stage measures true.
        fitFrame();
        recenter();
      };

      const step = (delta) => showFrame((openIndex + delta + states.length) % states.length);

      rack.addEventListener("click", (event) => {
        const frame = event.target.closest(".frame");
        if (!frame) return;
        showFrame([...rack.querySelectorAll(".frame")].indexOf(frame));
      });

      document.querySelector("#viewer-controls").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        if (button.dataset.step) return step(Number(button.dataset.step));
        if (button.id === "viewer-close") return viewer.close();
        fit = !fit;
        paintFit();
        fitFrame();
        recenter();
      });

      // A tap in the space around the frame dismisses; a horizontal drag moves
      // to the next frame. The flag stops the click that ends a swipe from also
      // closing the dialog. Swipe is off at actual size, where a drag is a pan.
      let swipeX = 0;
      let swipeY = 0;
      let swiped = false;

      stage.addEventListener("pointerdown", (event) => {
        swipeX = event.clientX;
        swipeY = event.clientY;
        swiped = false;
      });

      stage.addEventListener("pointerup", (event) => {
        const dx = event.clientX - swipeX;
        if (!fit || states.length < 2) return;
        if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(event.clientY - swipeY) * 1.5) return;
        swiped = true;
        step(dx < 0 ? 1 : -1);
      });

      stage.addEventListener("click", (event) => {
        if (swiped || event.target.closest(".frame")) return;
        viewer.close();
      });

      document.addEventListener("keydown", (event) => {
        if (!viewer.open || (event.key !== "ArrowRight" && event.key !== "ArrowLeft")) return;
        event.preventDefault();
        step(event.key === "ArrowRight" ? 1 : -1);
      });

      // The stage, not the window: this also catches the embed being resized and
      // the page being laid out for the first time after it was hidden, which a
      // resize event does not fire for.
      new ResizeObserver(() => {
        if (viewer.open) fitFrame();
      }).observe(stage);

      for (const button of document.querySelectorAll("[data-step]")) button.disabled = states.length < 2;
      paintFit();

      // ---- tab identity ----------------------------------------------------
      const heading = document.querySelector("h1").textContent.trim();
      document.title = `v${VERSION} · ${heading}`;
      document.querySelector("#favicon").href =
        "data:image/svg+xml," +
        encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0e7869"/><text x="16" y="24" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#ffffff">${VERSION}</text></svg>`,
        );
    </script>
  </body>
</html>
