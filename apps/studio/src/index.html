<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        connect-src 'self' http://localhost:* https://localhost:* http://*.localhost:* https://*.localhost:* http://*.lvh.me:* https://*.lvh.me:* https://*.posthog.com;
        default-src 'self' http://localhost:* https://localhost:* http://*.localhost:* https://*.localhost:* http://*.lvh.me:* https://*.lvh.me:*;
        font-src 'self' data:;
        frame-src 'self' data: mailto: tel: http://localhost:* https://localhost:* http://*.localhost:* https://*.localhost:* http://*.lvh.me:* https://*.lvh.me:*;
        img-src 'self' data: instrument: instrument-local: http://*.localhost:* https://*.googleusercontent.com https://*.gstatic.com https://*.googleapis.com https://images.google.com https://www.google.com https://github.com https://*.github.com https://*.githubusercontent.com https://*.s3.amazonaws.com;
        media-src 'self' data: http://localhost:* https://localhost:* http://*.localhost:* https://*.localhost:* http://*.lvh.me:* https://*.lvh.me:*;
        script-src 'self' https://*.posthog.com;
        style-src 'self' 'unsafe-inline' https://*.posthog.com;
      "
    />
    <style>
      body {
        margin: 0;
      }

      /* Boot shell: the empty app frame painted from this document, before the
         renderer bundle mounts. It gives the window a draggable title area and
         the app's own silhouette during the load, which is most visible in
         development. The real stylesheet only arrives with the app, so the ids,
         attributes, colors, and geometry below are literals; they are declared in
         shared/boot-shell.ts and shared/constants.ts, and client/boot-shell.test.ts
         fails if this markup and those constants disagree. */
      :root {
        --boot-background: #fafaf9;
        --boot-toolbar: #e7e5e4;
        --boot-border: #e7e5e4;
        --boot-foreground: #171412;
        --boot-shadow:
          0 1px 2px 0 rgb(10 13 18 / 0.04), 0 1px 1px 0 rgb(10 13 18 / 0.05);
      }

      /* The main process pins nativeTheme.themeSource to the stored theme
         preference before it creates a window, and Electron mirrors that onto
         prefers-color-scheme, so this resolves the user's actual choice (not
         just the OS one) on the very first frame, with no script involved. */
      @media (prefers-color-scheme: dark) {
        :root {
          --boot-background: #1c1917;
          --boot-toolbar: #292524;
          --boot-border: rgb(255 255 255 / 10%);
          --boot-foreground: #ffffff;
          --boot-shadow:
            0 1px 2px 0 rgb(0 0 0 / 0.24), 0 1px 1px 0 rgb(0 0 0 / 0.28);
        }
      }

      /* The app's stylesheet does this globally, but it only arrives with the
         app: without it the sidebar's border would sit outside its width, a
         pixel right of where the real rail draws it. */
      #boot-shell,
      #boot-shell * {
        box-sizing: border-box;
      }

      #boot-shell {
        background: var(--boot-background);
        display: flex;
        flex-direction: column;
        /* Mirrors ZoomRoot: `zoom` rescales the box, so the viewport sizing is
           divided by the same factor to keep covering the real viewport. */
        height: calc(100vh / var(--boot-zoom, 1));
        left: 0;
        overflow: hidden;
        position: fixed;
        top: 0;
        /* The zoom and the rest of the geometry arrive with syncBootShell, which
           sets the window type on the root. Until then the shell would be drawn
           at 1x and snap, so it waits: the window's background color is already
           the right one, and holds the frame in the meantime. */
        visibility: hidden;
        width: calc(100vw / var(--boot-zoom, 1));
        zoom: var(--boot-zoom, 1);
      }

      :root[data-window-type] #boot-shell {
        visibility: visible;
      }

      /* React's first commit fills #root, retiring the shell in the same frame. */
      #root:not(:empty) ~ #boot-shell {
        display: none;
      }

      /* The dev panel brings the shell back over the running app (see
         previewBootShell); this outranks the rule above on specificity alone,
         and lifts the shell over the app's own fixed overlays. */
      :root[data-boot-shell-preview] #root ~ #boot-shell {
        display: flex;
        z-index: 60;
      }

      /* Stretch, not center: the tab strip is sized by the toolbar's height the
         way the real one is, and its slots stretch inside that. */
      #boot-shell-toolbar {
        -webkit-app-region: drag;
        align-items: stretch;
        background: var(--boot-toolbar);
        display: flex;
        flex: none;
        height: var(--boot-toolbar-height, 40px);
      }

      /* The toolbar's control cluster: the sidebar toggle, then back/forward.
         The macOS traffic-light gutter is a fixed visual width, so --boot-gutter
         divides by the shell's zoom the way the real toolbar does. */
      #boot-shell-controls {
        align-items: center;
        display: flex;
        flex: none;
        gap: 1rem;
        padding-left: var(--boot-gutter, 1rem);
      }

      #boot-shell-nav {
        align-items: center;
        display: flex;
        gap: 0.25rem;
        padding-right: 0.25rem;
      }

      .boot-shell-icon-slot {
        align-items: center;
        display: flex;
        height: 1.5rem;
        justify-content: center;
        width: 1.5rem;
      }

      .boot-shell-icon {
        color: var(--boot-foreground);
        height: 1rem;
        opacity: 0.8;
        width: 1rem;
      }

      /* Back and forward start with no history to move through, so they carry
         the disabled treatment the real buttons do. */
      #boot-shell-nav .boot-shell-icon {
        opacity: 0.4;
      }

      #boot-shell-tabs {
        align-items: stretch;
        display: flex;
        flex: 1;
        gap: 0.25rem;
        min-width: 0;
        padding: 0.25rem 0.75rem;
      }

      /* One slot per restored tab, sized the way the real strip divides itself. */
      .boot-shell-tab {
        flex: 1 1 0;
        max-width: 15rem;
        min-width: 0;
      }

      /* The shadow is what makes the loaded tab read as a couple of pixels
         taller than the slot without it. */
      .boot-shell-tab[data-selected] {
        background: var(--boot-background);
        border-radius: 0.75rem;
        box-shadow: var(--boot-shadow);
      }

      #boot-shell-body {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      #boot-shell-sidebar {
        border-right: 1px solid var(--boot-border);
        display: none;
        flex: none;
        width: var(--boot-sidebar-width, 250px);
      }

      :root[data-sidebar-open="true"]:not([data-window-type="onboarding"])
        #boot-shell-sidebar {
        display: block;
      }

      /* The onboarding window has no chrome of its own, just a drag strip. */
      :root[data-window-type="onboarding"] #boot-shell-toolbar {
        background: transparent;
      }

      :root[data-window-type="onboarding"] #boot-shell-controls,
      :root[data-window-type="onboarding"] #boot-shell-tabs {
        display: none;
      }
    </style>
    <script type="module" src="/client/boot-shell.ts"></script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Icon paths are what @phosphor-icons/react renders for SidebarSimple,
         ArrowLeft, and ArrowRight at the app's `bold` weight; the test compares
         them against the components. -->
    <div aria-hidden="true" id="boot-shell">
      <div id="boot-shell-toolbar">
        <div id="boot-shell-controls">
          <span class="boot-shell-icon-slot">
            <svg
              class="boot-shell-icon"
              fill="currentColor"
              viewBox="0 0 256 256"
            >
              <path
                d="M216,36H40A20,20,0,0,0,20,56V200a20,20,0,0,0,20,20H216a20,20,0,0,0,20-20V56A20,20,0,0,0,216,36ZM44,60H76V196H44ZM212,196H100V60H212Z"
              />
            </svg>
          </span>
          <span id="boot-shell-nav">
            <span class="boot-shell-icon-slot">
              <svg
                class="boot-shell-icon"
                fill="currentColor"
                viewBox="0 0 256 256"
              >
                <path
                  d="M228,128a12,12,0,0,1-12,12H69l51.52,51.51a12,12,0,0,1-17,17l-72-72a12,12,0,0,1,0-17l72-72a12,12,0,0,1,17,17L69,116H216A12,12,0,0,1,228,128Z"
                />
              </svg>
            </span>
            <span class="boot-shell-icon-slot">
              <svg
                class="boot-shell-icon"
                fill="currentColor"
                viewBox="0 0 256 256"
              >
                <path
                  d="M224.49,136.49l-72,72a12,12,0,0,1-17-17L187,140H40a12,12,0,0,1,0-24H187L135.51,64.48a12,12,0,0,1,17-17l72,72A12,12,0,0,1,224.49,136.49Z"
                />
              </svg>
            </span>
          </span>
        </div>
        <div id="boot-shell-tabs">
          <div class="boot-shell-tab" data-selected></div>
        </div>
      </div>
      <div id="boot-shell-body"><div id="boot-shell-sidebar"></div></div>
    </div>
    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
