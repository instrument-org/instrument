<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!--
      A packaged build loads from `file://`, which sends no referrer; dev loads
      from `http://localhost`, which would. No referrer at all keeps the two
      alike, and some hosts (Google's account pictures among them) refuse a
      request that names localhost as where it came from.
    -->
    <meta name="referrer" content="no-referrer" />
    <!-- Filled in for the build flavor's own scheme by `content-security-policy.ts`. -->
    <meta http-equiv="Content-Security-Policy" />
    <style>
      body {
        margin: 0;
      }

      /* Until the renderer mounts there is no toolbar to drag the window by, so
         the document provides one, as tall as the toolbar will be (see
         TOOLBAR_HEIGHT in shared/constants.ts). It paints nothing: the window's
         own background color, which the main process resolves from the theme
         preference, covers the frame on its own. React's first commit fills
         #root, retiring the strip before it can swallow clicks meant for the
         real toolbar underneath. */
      #boot-drag-region {
        -webkit-app-region: drag;
        height: 40px;
        left: 0;
        position: fixed;
        right: 0;
        top: 0;
      }

      #root:not(:empty) ~ #boot-drag-region {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div aria-hidden="true" id="boot-drag-region"></div>
    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
