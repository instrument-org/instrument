name: Smoke Test

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs: {}

env:
  DO_NOT_TRACK: "1"
  MAIN_VITE_APP_API_BASE_URL: ${{ vars.MAIN_VITE_APP_API_BASE_URL }}
  MAIN_VITE_GOOGLE_CLIENT_ID: intentionally-invalid-client-id
  MAIN_VITE_GOOGLE_CLIENT_SECRET: intentionally-invalid-client-secret
  VITE_POSTHOG_API_HOST: intentionally-invalid-api-host
  VITE_POSTHOG_API_KEY: intentionally-invalid-api-key

jobs:
  smoke_test:
    name: Studio Smoke Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-binary-caches
      - uses: ./.github/actions/prepare
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: rharkor/caching-for-turbo@v2.3.11
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Start Xvfb
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Build and run smoke test
        run: pnpm turbo run smoke-test
      - name: Upload main window screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: apps/studio/smoke-test-screenshots/main-window.png
          archive: false
          if-no-files-found: ignore
      - name: Upload sidebar window screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: apps/studio/smoke-test-screenshots/sidebar-window.png
          archive: false
          if-no-files-found: ignore
