body:
  - attributes:
      value: |
        Thanks for taking the time to report this. Please search [existing issues](https://github.com/instrument-org/instrument/issues?q=is%3Aissue) first so we keep one thread per problem.

        Have a question rather than a bug? [Ask in Q&A](https://github.com/instrument-org/instrument/discussions/new?category=q-a) instead.
    type: markdown
  - attributes:
      description: What went wrong, and what did you expect instead? Screenshots and screen recordings help a lot.
      label: What happened
    id: what-happened
    type: textarea
    validations:
      required: true
  - attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new task.
        2. Ask it to generate an image.
        3. The request fails with an error.
    id: steps
    type: textarea
    validations:
      required: true
  - attributes:
      description: Settings, then General, then About.
      label: Instrument version
      placeholder: 1.6.2
    id: version
    type: input
    validations:
      required: true
  - attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    id: os
    type: dropdown
    validations:
      required: true
  - attributes:
      description: On Linux, include the distribution and desktop environment.
      label: Operating system version
      placeholder: Ubuntu 24.04, GNOME 46
    id: os-version
    type: input
    validations:
      required: true
  - attributes:
      description: Open the model picker next to the send button to check.
      label: Which model were you using?
      options:
        - Instrument Auto
        - A model I picked myself
        - Not sure
        - Not related to a model
    id: model-selection
    type: dropdown
    validations:
      required: true
  - attributes:
      description: If you picked a model yourself, paste what the model picker shows.
      label: Model name
      placeholder: claude-opus-5
    id: model
    type: input
  - attributes:
      description: Paste the full text rather than a screenshot of it, so it is searchable. Remove any API keys first.
      label: Error message or logs
      render: text
    id: logs
    type: textarea
description: Something in Instrument is not working the way it should.
labels: ["bug", "needs-triage"]
name: Bug Report
