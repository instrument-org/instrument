packages:
  - packages/*
  - apps/*

allowBuilds:
  "@swc/core": true
  "@vscode/ripgrep": true
  agent-browser: true
  better-sqlite3: false
  core-js: true
  dugite: true
  electron: true
  electron-winstaller: true
  esbuild: true
  ffmpeg-ffprobe-static: true
  msw: true
  protobufjs: true
  sharp: true
  tree-sitter-javascript: true
  unrs-resolver: true
blockExoticSubdeps: true

catalog:
  "@electron/asar": ^3.4.1
  "@orpc/client": ^1.15.2
  "@orpc/contract": ^1.15.2
  "@orpc/server": ^1.15.2
  "@orpc/shared": ^1.15.2
  "@orpc/tanstack-query": ^1.15.2
  "@types/node": 24.13.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  ai: ^7.0.134
  better-auth: ^1.7.7
  hono: ^4.13.13
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: 7.0.2
  typescript-result: ^3.5.2
  vite: ^8.3.4
  vitest: ^5.0.3
  zod: ^4.6.5

ignoredOptionalDependencies:
  # The Claude account downloads its own Claude Code at runtime, never a copy we ship.
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl"
  - "@anthropic-ai/claude-agent-sdk-linux-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64"
  - "@anthropic-ai/claude-agent-sdk-win32-x64"
  - "@mongodb-js/zstd"
  - better-sqlite3
  - node-liblzma

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - agent-browser
  # Security release (GHSA-jr5w-w6x2-84p9, compromised eMudhra intermediate
  # CAs) taken ahead of the age cutoff. Exact version, so the age guard still
  # covers every later Electron release; the entry goes inert once 44.9.3
  # passes the cutoff and can be dropped.
  - "electron@44.9.3"
  # Document-viewer libraries pinned to exact pre-1.0 versions. The viewers are
  # written against these exact releases, so a newer publish is a deliberate
  # upgrade rather than something to float onto.
  - "@extend-ai/react-docx"
  - "@extend-ai/react-pptx"
  - "@extend-ai/react-xlsx"
  # Transitive, version-locked by @extend-ai/react-xlsx.
  - "@dukelib/sheets-wasm"
  # Security release (GHSA-4p2c-m292-ghmh, DoS in RPCHandler deserialization)
  # taken the day it shipped. Exact versions, so the age guard still covers
  # every later oRPC release; the entries go inert once 1.15.2 passes the
  # cutoff and can be dropped.
  - "@orpc/client@1.15.2"
  - "@orpc/contract@1.15.2"
  - "@orpc/interop@1.15.2"
  - "@orpc/server@1.15.2"
  - "@orpc/shared@1.15.2"
  - "@orpc/standard-server-aws-lambda@1.15.2"
  - "@orpc/standard-server-fastify@1.15.2"
  - "@orpc/standard-server-fetch@1.15.2"
  - "@orpc/standard-server-node@1.15.2"
  - "@orpc/standard-server-peer@1.15.2"
  - "@orpc/standard-server@1.15.2"
  - "@orpc/tanstack-query@1.15.2"
  # The Markdown editor spike is written against this exact Milkdown release.
  - "@milkdown/components@7.22.2"
  - "@milkdown/core@7.22.2"
  - "@milkdown/crepe@7.22.2"
  - "@milkdown/ctx@7.22.2"
  - "@milkdown/exception@7.22.2"
  - "@milkdown/kit@7.22.2"
  - "@milkdown/plugin-block@7.22.2"
  - "@milkdown/plugin-clipboard@7.22.2"
  - "@milkdown/plugin-cursor@7.22.2"
  - "@milkdown/plugin-diff@7.22.2"
  - "@milkdown/plugin-history@7.22.2"
  - "@milkdown/plugin-indent@7.22.2"
  - "@milkdown/plugin-listener@7.22.2"
  - "@milkdown/plugin-slash@7.22.2"
  - "@milkdown/plugin-streaming@7.22.2"
  - "@milkdown/plugin-tooltip@7.22.2"
  - "@milkdown/plugin-trailing@7.22.2"
  - "@milkdown/plugin-upload@7.22.2"
  - "@milkdown/preset-commonmark@7.22.2"
  - "@milkdown/preset-gfm@7.22.2"
  - "@milkdown/prose@7.22.2"
  - "@milkdown/transformer@7.22.2"
  - "@milkdown/utils@7.22.2"
  # The agent's sandbox, taken five days after release with its patch rebuilt
  # and verified against it. Exact version, so later just-bash releases still
  # wait out the guard; the entry goes inert once 3.6.0 passes the cutoff and
  # can be dropped.
  - "just-bash@3.6.0"

overrides:
  "@electron/rebuild>node-abi": 4.35.0
  # Collapse jiti to a single version so vite (which has jiti as an optional
  # peer) resolves to one peer-variant. Two jiti versions otherwise spawn two
  # vite variants, making Plugin types "unrelated" and breaking the type check on
  # electron.vite.config.ts.
  jiti: 2.7.0
  # mermaid sanitizes agent-written diagrams through DOMPurify, and Milkdown
  # bundles it too; 3.4.5 carries several sanitizer-bypass advisories.
  dompurify: ^3.4.16
  # better-auth merges options with defu; 6.1.4 lets a __proto__ key in the
  # defaults pollute the prototype.
  defu: ^6.1.7
  # neverthrow 8.2.0 lists rollup's Linux x64 binary as an optional dependency
  # by mistake (supermacro/neverthrow#602), so a Linux x64 install put a build
  # tool's native module in the packaged app. Rollup keeps its own.
  "neverthrow>@rollup/rollup-linux-x64-gnu": "-"

patchedDependencies:
  "@milkdown/plugin-block@7.22.2": patches/@milkdown__plugin-block@7.22.2.patch
  conf@14.0.0: patches/conf@14.0.0.patch
  ffmpeg-ffprobe-static@7.1.0-rc.1: patches/ffmpeg-ffprobe-static@7.1.0-rc.1.patch
  just-bash@3.6.0: patches/just-bash@3.6.0.patch
  micromark-extension-gfm-table@2.1.1: patches/micromark-extension-gfm-table@2.1.1.patch
  sonner@2.0.7: patches/sonner@2.0.7.patch

# pnpm 11 defaults this to "install", so every `pnpm run`/`pnpm exec` verifies
# the store first and silently spawns an install when it looks stale. With
# long-running dev servers and several agents sharing one store, those implicit
# installs race and deadlock. "false" restores the pnpm 10 behavior: run the
# command as asked, install only when asked.
verifyDepsBeforeRun: false
